
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Block World Mobile</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#91c9e9;font-family:system-ui,Arial;color:white;touch-action:none}
#game{position:fixed;inset:0;z-index:0}#game canvas{display:block;width:100%;height:100%}
#hud{position:fixed;z-index:3;inset:env(safe-area-inset-top,8px) 8px auto;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.panel{background:#101923a8;border:1px solid #ffffff35;border-radius:12px;padding:8px 10px;backdrop-filter:blur(5px);font-size:12px;text-shadow:0 1px 2px #000}
#topButtons{display:flex;gap:5px;pointer-events:auto}
button{color:white;background:#14202dcc;border:1px solid #ffffff55;border-radius:10px;padding:9px 10px;font-weight:650;font-size:12px;touch-action:manipulation}
#hint{position:fixed;z-index:3;top:70px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;background:#10192388;padding:6px 10px;border-radius:20px;pointer-events:none}
#cross{position:fixed;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);width:15px;height:15px;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 1px 3px #000}
#cross:before{width:2px;height:15px;left:6px}#cross:after{height:2px;width:15px;top:6px}
#joystick{position:fixed;z-index:5;left:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:150px;height:150px;touch-action:none;user-select:none}
#joyOuter{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(35,52,56,.14) 0 45%,rgba(15,32,42,.25) 72%,rgba(255,255,255,.05) 100%);border:2px solid rgba(240,211,113,.7);box-shadow:inset 0 0 0 14px rgba(239,216,145,.08),0 0 0 1px #ffffff25}
#joyRing{position:absolute;inset:10px;border-radius:50%;border:1px solid rgba(247,218,137,.48)}
#joyBlue{position:absolute;inset:-2px;border-radius:50%;border:4px solid transparent;border-left-color:rgba(80,193,255,.88);border-bottom-color:rgba(80,193,255,.5);transform:rotate(-24deg);filter:drop-shadow(0 0 4px #46b8ff66)}
#joyKnob{position:absolute;left:50%;top:50%;width:60px;height:60px;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#6a765c,#293b39 65%,#111d24);border:2px solid #d7bd70;box-shadow:0 3px 10px #0008,inset 0 0 0 4px #ffffff15}
#joyKnob svg{width:42px;height:42px;filter:drop-shadow(0 1px 2px #000)}
#actions{position:fixed;z-index:4;right:12px;bottom:calc(22px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,58px);gap:7px}
.act{height:54px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;background:#16212bbd}
.act strong{font-size:20px;line-height:20px}
#hotbar{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(166px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:5px;background:#10192399;border:1px solid #ffffff25;border-radius:11px;max-width:calc(100vw - 20px);overflow-x:auto}
.slot{flex:0 0 40px;width:40px;height:44px;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;background:#15212bc9;border-radius:7px}
.slot span{font-size:19px}.slot.sel{border:2px solid #ffe17a;background:#ffffff30}
#toast{position:fixed;z-index:9;top:45%;left:50%;transform:translate(-50%,-50%);max-width:85vw;background:#101923e8;border:1px solid #ffffff33;border-radius:12px;padding:12px 15px;font-size:13px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#modal{display:none;position:fixed;z-index:8;inset:0;background:#0009;align-items:center;justify-content:center;padding:18px}
#modal.show{display:flex}#card{width:min(420px,100%);max-height:80vh;overflow:auto;background:#17232df5;border:1px solid #ffffff3a;border-radius:16px;padding:16px}
#items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.item{padding:10px 4px;text-align:center}.item span{display:block;font-size:24px}
#error{display:none;position:fixed;z-index:20;inset:0;background:#14202b;color:white;padding:28px;overflow:auto}
@media(max-width:500px){#joystick{width:132px;height:132px;left:15px;bottom:calc(22px + env(safe-area-inset-bottom,0px))}#joyKnob{width:54px;height:54px}#joyKnob svg{width:38px;height:38px}#hotbar{bottom:calc(158px + env(safe-area-inset-bottom,0px))}#hint{top:72px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div class="panel"><div id="health">♥ ♥ ♥ ♥ ♥</div><div id="coords">X 0 · Z 0</div><div>BLOCK WORLD</div></div>
 <div id="topButtons"><button id="bag">🎒 Đồ</button><button id="save">💾 Lưu</button><button id="load">↻ Tải</button></div>
</div>
<div id="hint">Kéo joystick để đi · Vuốt màn hình để nhìn</div><div id="cross"></div>
<div id="joystick" aria-label="Joystick di chuyển">
 <div id="joyOuter"></div><div id="joyRing"></div><div id="joyBlue"></div>
 <div id="joyKnob"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="42" fill="none" stroke="#d8c477" stroke-width="2"/><path d="M50 12 L59 39 L88 50 L59 61 L50 88 L41 61 L12 50 L41 39 Z" fill="#d9d2a6" stroke="#82794e" stroke-width="2"/><path d="M50 25 L55 45 L75 50 L55 55 L50 75 L45 55 L25 50 L45 45 Z" fill="#f6efce"/><circle cx="50" cy="50" r="7" fill="#4b5b4b" stroke="#e6d48c" stroke-width="2"/></svg></div>
</div>
<div id="hotbar"></div>
<div id="actions"><button class="act" id="jump"><strong>⬆</strong>Nhảy</button><button class="act" id="mine"><strong>⛏</strong>Phá khối</button><button class="act" id="place"><strong>▧</strong>Đặt khối</button><button class="act" id="eat"><strong>🍎</strong>Ăn táo</button></div>
<div id="modal"><div id="card"><h2>🎒 Túi đồ</h2><p>Chọn vật phẩm muốn đặt xuống.</p><div id="items"></div><p><button id="craft">🪵 Chế tạo ván (cần 2 gỗ)</button> <button id="close">Đóng</button></p></div></div>
<div id="toast"></div>
<div id="error"><h2>Không tải được game 3D</h2><p id="errtext">Hãy kiểm tra Internet, sau đó mở lại file bằng Safari hoặc trình duyệt có hỗ trợ WebGL.</p></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
function toast(s){const e=$('toast');e.textContent=s;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1700)}
if(!window.THREE){$('error').style.display='block';$('errtext').textContent='Không tải được thư viện Three.js. Hãy bật Internet và mở lại file bằng Safari.';return}
try{
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8bc9ed);scene.fog=new THREE.Fog(0x8bc9ed,22,55);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;$('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe0f4ff,0x66734b,2.1));const sun=new THREE.DirectionalLight(0xfff1d3,2);sun.position.set(-8,20,10);scene.add(sun);
const material={grass:new THREE.MeshLambertMaterial({color:0x5eaa43}),dirt:new THREE.MeshLambertMaterial({color:0x805737}),stone:new THREE.MeshLambertMaterial({color:0x858b90}),wood:new THREE.MeshLambertMaterial({color:0x97633a}),leaves:new THREE.MeshLambertMaterial({color:0x327d3c}),sand:new THREE.MeshLambertMaterial({color:0xd9c27c}),plank:new THREE.MeshLambertMaterial({color:0xb88b52}),water:new THREE.MeshLambertMaterial({color:0x398fce,transparent:true,opacity:.72})};
const cube=new THREE.BoxGeometry(1,1,1),blocks=new Map(),animals=[];const k=(x,y,z)=>`${x},${y},${z}`;
function put(x,y,z,type){const id=k(x,y,z);if(blocks.has(id))return false;const m=new THREE.Mesh(cube,material[type]||material.dirt);m.position.set(x,y,z);m.userData={x,y,z,type};scene.add(m);blocks.set(id,m);return true}
function del(x,y,z){const id=k(x,y,z),m=blocks.get(id);if(!m)return null;scene.remove(m);blocks.delete(id);return m.userData.type}
function solid(x,y,z){return blocks.has(k(Math.round(x),Math.floor(y+.5),Math.round(z)))}
function height(x,z){return Math.floor(1+Math.sin(x*.28)*.8+Math.cos(z*.24)*.7)}
function buildWorld(){
 for(let x=-18;x<=18;x++)for(let z=-18;z<=18;z++){let h=height(x,z);for(let y=-2;y<=h;y++)put(x,y,z,y===h?'grass':y<h-2?'stone':'dirt')}
 for(let x=-18;x<18;x+=1)for(let z=-18;z<18;z+=1)if(Math.random()<.012&&Math.abs(x)>3&&Math.abs(z)>3){let h=height(x,z);for(let y=1;y<=3;y++)put(x,h+y,z,'wood');for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)for(let dy=2;dy<=4;dy++)if(Math.abs(dx)+Math.abs(dz)<3)put(x+dx,h+dy,z+dz,'leaves')}
 for(let x=-8;x<=-6;x++)for(let z=5;z<=7;z++){let h=height(x,z);del(x,h,z);put(x,h,z,'water')}
}
buildWorld();
const player={x:0,z:0,y:height(0,0)+1.8,yaw:0,pitch:-.1,vy:0,ground:true,hp:5};
const inv={grass:25,dirt:18,stone:12,wood:5,leaves:4,sand:5,plank:0,apple:3};let selected='grass',joy={x:0,y:0},joyOn=false,lookOn=false,lastX=0,lastY=0,paused=false;
const types=[['grass','🌱','Cỏ'],['dirt','🟫','Đất'],['stone','🪨','Đá'],['wood','🪵','Gỗ'],['leaves','🌿','Lá'],['sand','🏖️','Cát'],['plank','🪚','Ván']];
function bar(){const b=$('hotbar');b.innerHTML='';types.forEach(([t,e])=>{let q=document.createElement('button');q.className='slot'+(selected===t?' sel':'');q.innerHTML=`<span>${e}</span>${inv[t]||0}`;q.onclick=()=>{selected=t;bar()};b.appendChild(q)})}
function spawnAnimal(kind,x,z){const g=new THREE.Group(),body=new THREE.MeshLambertMaterial({color:kind==='sheep'?0xf0eee7:kind==='pig'?0xe99b9e:0x4d514f}),head=new THREE.MeshLambertMaterial({color:kind==='pig'?0xf5b3b5:0xe7dfd2});function part(w,h,d,m,px,py,pz){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(px,py,pz);g.add(o)}part(.75,.5,.48,body,0,.62,0);part(.34,.35,.32,head,0,.9,-.34);for(let a of [-.23,.23])for(let b of [-.14,.14])part(.13,.32,.13,body,a,.23,b);g.position.set(x,height(Math.round(x),Math.round(z)),z);scene.add(g);animals.push({g,x,z,kind,dir:Math.random()*6,step:0})}
for(let i=0;i<8;i++)spawnAnimal(i%2?'sheep':'pig',Math.random()*12-6,Math.random()*12-6);
function hitBlock(){const origin=camera.position.clone(),dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);for(let t=.2;t<5;t+=.07){let p=origin.clone().addScaledVector(dir,t),x=Math.round(p.x),y=Math.round(p.y),z=Math.round(p.z);if(blocks.has(k(x,y,z))){let prev=origin.clone().addScaledVector(dir,t-.12);return{x,y,z,px:Math.round(prev.x),py:Math.round(prev.y),pz:Math.round(prev.z)}}}return null}
function mine(){let h=hitBlock();if(!h){toast('Hãy nhìn vào khối gần bạn');return}let t=del(h.x,h.y,h.z);if(t){inv[t]=(inv[t]||0)+1;bar();toast('Đã phá khối')}}
function place(){if(!inv[selected]){toast('Không đủ khối');return}let h=hitBlock();if(!h){toast('Hãy nhìn vào mặt khối');return}let x=h.px,y=h.py,z=h.pz;if(Math.abs(x-player.x)<.8&&Math.abs(z-player.z)<.8){toast('Không thể đặt vào người chơi');return}if(put(x,y,z,selected)){inv[selected]--;bar()}}
$('mine').onclick=mine;$('place').onclick=place;$('jump').onclick=()=>{if(player.ground){player.vy=7;player.ground=false}};$('eat').onclick=()=>{if(inv.apple>0&&player.hp<5){inv.apple--;player.hp++;toast('Đã hồi máu')}else toast(player.hp===5?'Máu đang đầy':'Không còn táo')};
function inventory(){const e=$('items');e.innerHTML='';[...types,['apple','🍎','Táo']].forEach(([t,em,n])=>{let b=document.createElement('button');b.className='item';b.innerHTML=`<span>${em}</span>${n}<br>${inv[t]||0}`;b.onclick=()=>{selected=t;bar();$('modal').classList.remove('show')};e.appendChild(b)})}
$('bag').onclick=()=>{inventory();$('modal').classList.add('show')};$('close').onclick=()=>$('modal').classList.remove('show');
$('craft').onclick=()=>{if(inv.wood>=2){inv.wood-=2;inv.plank+=4;bar();inventory();toast('Đã chế tạo 4 ván')}else toast('Cần 2 gỗ')};
function save(){try{localStorage.setItem('blockWorldSave',JSON.stringify({blocks:[...blocks].map(([id,m])=>[id,m.userData.type]),player,inv,animals:animals.map(a=>[a.kind,a.x,a.z])}));toast('Đã lưu thế giới')}catch(e){toast('Trình duyệt không cho lưu dữ liệu')}}
function load(){try{let d=JSON.parse(localStorage.getItem('blockWorldSave'));if(!d){toast('Chưa có bản lưu');return}for(const m of blocks.values())scene.remove(m);blocks.clear();for(const [id,t] of d.blocks){let [x,y,z]=id.split(',').map(Number);put(x,y,z,t)}Object.assign(player,d.player);Object.assign(inv,d.inv);for(const a of animals)scene.remove(a.g);animals.length=0;(d.animals||[]).forEach(a=>spawnAnimal(a[0],a[1],a[2]));bar();toast('Đã tải thế giới')}catch(e){toast('Không đọc được bản lưu')}}
$('save').onclick=save;$('load').onclick=load;
const joyEl=$('joystick'),knob=$('joyKnob');
function joyMove(e){const r=joyEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),max=r.width*.32,len=Math.hypot(dx,dy),s=len>max?max/len:1;joy.x=dx*s/max;joy.y=dy*s/max;knob.style.left=`calc(50% + ${dx*s}px)`;knob.style.top=`calc(50% + ${dy*s}px)`;knob.style.transform='translate(-50%,-50%)'}
function joyEnd(){joyOn=false;joy.x=joy.y=0;knob.style.left='50%';knob.style.top='50%';knob.style.transform='translate(-50%,-50%)'}
joyEl.addEventListener('pointerdown',e=>{e.preventDefault();joyOn=true;joyEl.setPointerCapture(e.pointerId);joyMove(e)});joyEl.addEventListener('pointermove',e=>{if(joyOn)joyMove(e)});joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
renderer.domElement.addEventListener('pointerdown',e=>{lookOn=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!lookOn)return;let dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;player.yaw-=dx*.004;player.pitch=Math.max(-1,Math.min(.8,player.pitch-dy*.004))});renderer.domElement.addEventListener('pointerup',()=>lookOn=false);renderer.domElement.addEventListener('pointercancel',()=>lookOn=false);
function tick(t){requestAnimationFrame(tick);let dt=Math.min(.04,((t-tick.last)||16)/1000);tick.last=t;if(!paused){let f=-joy.y,s=joy.x,dx=(Math.sin(player.yaw)*f+Math.cos(player.yaw)*s)*4*dt,dz=(-Math.cos(player.yaw)*f+Math.sin(player.yaw)*s)*4*dt;let nx=player.x+dx,nz=player.z+dz;function bodyBlocked(x,z){return blocks.has(k(Math.round(x),Math.floor(player.y-.3),Math.round(z)))||blocks.has(k(Math.round(x),Math.floor(player.y+.3),Math.round(z)))}if(!bodyBlocked(nx,player.z))player.x=nx;if(!bodyBlocked(player.x,nz))player.z=nz;player.vy-=18*dt;player.y+=player.vy*dt;let floor=height(Math.round(player.x),Math.round(player.z))+1.8;if(player.y<=floor){player.y=floor;player.vy=0;player.ground=true}else player.ground=false;player.x=Math.max(-17,Math.min(17,player.x));player.z=Math.max(-17,Math.min(17,player.z));animals.forEach(a=>{a.step+=dt;if(Math.random()<.008)a.dir+=(Math.random()-.5)*2;a.x+=Math.sin(a.dir)*dt*.4;a.z+=Math.cos(a.dir)*dt*.4;a.g.position.set(a.x,height(Math.round(a.x),Math.round(a.z)),a.z);a.g.rotation.y=a.dir})}
camera.position.set(player.x,player.y+.15,player.z);camera.rotation.order='YXZ';camera.rotation.y=player.yaw;camera.rotation.x=player.pitch;renderer.render(scene,camera);$('coords').textContent=`X ${Math.round(player.x)} · Z ${Math.round(player.z)}`;$('health').textContent='♥ '.repeat(player.hp).trim()+'♡ '.repeat(5-player.hp)}
bar();requestAnimationFrame(tick);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))});
}catch(e){$('error').style.display='block';$('errtext').textContent='Lỗi khởi tạo game: '+e.message+' — hãy mở bằng trình duyệt hỗ trợ WebGL.';console.error(e)}
})();
</script>
</body>
</html>
