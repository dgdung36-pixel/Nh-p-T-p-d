<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#070810">
<title>TOOL GỘP BYTES PRO V7 - SMART MOD RECALL PARSER</title>
<style>
:root {
  --primary: #ff0055;
  --primary-glow: rgba(255, 0, 85, 0.65);
  --accent: #00f3ff;
  --accent-glow: rgba(0, 243, 255, 0.65);
  --success: #00ff9d;
  --warning: #ffb700;
  --bg-dark: #05060a;
  --card-bg: rgba(10, 13, 24, 0.88);
  --border-color: rgba(0, 243, 255, 0.3);
  --text-main: #f0f3f8;
  --font-mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
}

*{ box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0; min-height: 100vh; background: var(--bg-dark);
  color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex; justify-content: center; padding: 24px 14px; position: relative; overflow-x: hidden;
}

#bgCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
body::before {
  content: ""; position: fixed; inset: 0;
  background-image: radial-gradient(rgba(0, 243, 255, 0.1) 1px, transparent 0);
  background-size: 24px 24px; pointer-events: none; z-index: 1; opacity: 0.4;
}

.app { width: 100%; max-width: 720px; position: relative; z-index: 2; }

header { text-align: center; margin-bottom: 24px; position: relative; }
.logo-title {
  font-size: 36px; font-weight: 900; letter-spacing: 2px; margin: 0;
  background: linear-gradient(135deg, #fff 0%, var(--primary) 40%, var(--accent) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 15px var(--primary-glow));
}

.sub-tag {
  display: inline-block; margin-top: 8px; padding: 6px 20px;
  color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: 2px;
  background: rgba(0, 243, 255, 0.08); border: 1px solid var(--accent); border-radius: 20px;
  box-shadow: 0 0 15px var(--accent-glow); text-transform: uppercase;
}

.hud-panel {
  display: flex; justify-content: space-between; align-items: center; margin-top: 12px;
  padding: 8px 16px; background: rgba(0, 0, 0, 0.7); border: 1px solid var(--border-color);
  border-radius: 12px; font-size: 12px; font-family: var(--font-mono); color: #888;
}
.hud-panel span.val { color: #fff; font-weight: bold; text-shadow: 0 0 8px var(--accent); }

.card {
  background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border-color); border-radius: 20px; padding: 22px; margin-bottom: 20px;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8); transition: all 0.3s ease;
}

.card-header {
  font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px;
  color: var(--accent); margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between;
}
.card-header .title-text { display: flex; align-items: center; gap: 8px; }
.card-header .title-text::before {
  content: ""; display: inline-block; width: 4px; height: 14px; background: var(--primary); border-radius: 2px;
}

.drop-zone {
  border: 2px dashed rgba(0, 243, 255, 0.4); border-radius: 18px; padding: 30px 20px;
  text-align: center; cursor: pointer; transition: all 0.3s ease; background: rgba(4, 6, 14, 0.6);
}
.drop-zone:hover, .drop-zone.over {
  border-color: var(--primary); background: rgba(255, 0, 85, 0.1); transform: translateY(-2px);
}
.drop-zone .icon { font-size: 42px; margin-bottom: 10px; filter: drop-shadow(0 0 12px var(--accent)); }

.files-list { margin-top: 16px; display: grid; gap: 10px; max-height: 280px; overflow-y: auto; padding-right: 4px; }
.files-list::-webkit-scrollbar { width: 5px; }
.files-list::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

.file-row {
  display: flex; align-items: center; gap: 12px; background: rgba(7, 9, 18, 0.9);
  border-radius: 14px; padding: 12px 14px; border: 1px solid rgba(255, 255, 255, 0.08);
}

.file-row .num { font-size: 12px; font-weight: 900; color: var(--primary); font-family: var(--font-mono); width: 22px; }
.file-row .info { flex: 1; overflow: hidden; }
.file-row .name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
.file-row .details { font-size: 11px; color: #888; margin-top: 3px; font-family: var(--font-mono); display: flex; gap: 10px; }

.tag-badge { display: inline-block; font-size: 9px; font-weight: 800; padding: 1px 6px; border-radius: 4px; }
.tag-json { background: rgba(0, 255, 157, 0.2); color: var(--success); border: 1px solid var(--success); }
.tag-script { background: rgba(0, 243, 255, 0.2); color: var(--accent); border: 1px solid var(--accent); }
.tag-bin { background: rgba(255, 0, 85, 0.2); color: var(--primary); border: 1px solid var(--primary); }

.file-btns { display: flex; gap: 5px; }
.btn-mini {
  background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); color: #ccc;
  border-radius: 8px; padding: 6px 9px; font-size: 12px; cursor: pointer;
}
.btn-mini:hover { background: var(--accent); color: #000; font-weight: bold; }

.form-grid { display: grid; gap: 14px; margin-top: 10px; }
.form-group label { display: block; font-size: 11px; font-weight: 800; color: var(--accent); margin-bottom: 6px; text-transform: uppercase; }
.form-group select, .form-group input {
  width: 100%; padding: 13px; background: rgba(0, 0, 0, 0.7); color: #fff;
  border: 1px solid var(--border-color); border-radius: 12px; font-size: 13px; font-weight: 600;
}

button.btn-main {
  width: 100%; border: 0; border-radius: 16px; padding: 18px; font-size: 15px; font-weight: 900;
  cursor: pointer; transition: all 0.3s ease; letter-spacing: 1px; text-transform: uppercase;
}
.btn-primary { background: linear-gradient(135deg, var(--primary) 0%, #b8003a 100%); color: #fff; box-shadow: 0 6px 25px var(--primary-glow); }
.btn-primary:disabled { background: #161218; color: #444; box-shadow: none; cursor: not-allowed; border: 1px solid #222; }

.status-box { margin-top: 14px; font-size: 13px; text-align: center; min-height: 24px; font-weight: 700; }
.status-box.ok { color: var(--success); }
.status-box.err { color: #ff3366; }

.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9);
  backdrop-filter: blur(16px); z-index: 999; padding: 20px; align-items: center; justify-content: center;
}
.modal-window {
  background: #080a12; border: 1px solid var(--accent); border-radius: 22px;
  width: 100%; max-width: 650px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden;
}
.modal-head { padding: 18px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
.modal-body { padding: 18px; overflow-y: auto; font-family: var(--font-mono); font-size: 12px; color: var(--accent); white-space: pre-wrap; word-break: break-all; }
.modal-close { background: none; border: 0; color: #fff; font-size: 24px; cursor: pointer; }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="app">
  <header>
    <h1 class="logo-title">CYBER RE-PACKER V7</h1>
    <div><span class="sub-tag">MOD RECALL & SKIN PROTECTOR</span></div>
    <div class="hud-panel">
      <div>PARSER: <span class="val" id="parserStatus">READY</span></div>
      <div>MODE: <span class="val">ARRAY RECALL PRESERVE</span></div>
      <div>TIME: <span class="val" id="clock">--:--:--</span></div>
    </div>
  </header>

  <div class="card">
    <div class="card-header">
      <div class="title-text">Danh sách File Mod Code (.Bytes)</div>
      <div style="font-size:11px; color:#888;" id="totalSizeTag">Tổng: 0 KB</div>
    </div>
    <div id="dropZone" class="drop-zone">
      <div class="icon">🧩</div>
      <b style="font-size:16px; color:#fff;">KÉO THẢ HOẶC BẤM ĐỂ CHỌN FILE .BYTES</b>
      <div style="font-size:12px; color:#888; margin-top:6px;">Bảo vệ hiệu ứng Biến về (Recall) không bị đè dữ liệu</div>
      <input id="picker" type="file" accept=".bytes" multiple style="display:none;">
    </div>
    <div id="filesList" class="files-list"></div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="title-text">Chế độ giải mã & hợp nhất Code</div>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>🛠️ Cơ chế hợp nhất mã nguồn (Khắc phục lỗi Biến về):</label>
        <select id="mergeAlgorithm">
          <option value="smart_mod_recall">1. Smart Mod Recall Merger (Chuyên Mod Skin - Nối mảng Biến về & Scope Lua)</option>
          <option value="protobuf_varint">2. Protobuf Varint Container (Tự tính lại Index độ dài Binary - Giữ Biến về Bin)</option>
          <option value="header_preserve">3. Header Preservation (Ghép mảng Byte nguyên bản từ File 1)</option>
          <option value="clean_raw">4. Clean Text Append (Nối dòng cách biệt Lua/Script)</option>
        </select>
      </div>

      <div class="form-group">
        <label>✏️ Tên File Xuất (.bytes):</label>
        <input type="text" id="customFileName" placeholder="Nhập tên file đầu ra...">
      </div>
    </div>

    <button class="btn-main btn-primary" id="mergeBtn" disabled style="margin-top:20px;">XỬ LÝ CODE & GỘP FILE MOD</button>
    <div id="statusBox" class="status-box"></div>
  </div>
</div>

<div id="previewModal" class="modal-overlay">
  <div class="modal-window">
    <div class="modal-head">
      <b id="modalTitle" style="font-size:13px; color:var(--accent);">Code & Hex Viewer</b>
      <button class="modal-close" id="closeModal">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
// --- CANVAS BACKGROUND ---
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let particles = [];
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas); resizeCanvas();

class Particle {
  constructor() {
    this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
    this.size = Math.random() * 2 + 0.5; this.speedX = (Math.random() - 0.5) * 0.5;
    this.speedY = (Math.random() - 0.5) * 0.5; this.color = Math.random() > 0.5 ? '#00f3ff' : '#ff0055';
  }
  update() {
    this.x += this.speedX; this.y += this.speedY;
    if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
    if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
  }
  draw() {
    ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
  }
}
for (let i = 0; i < 40; i++) particles.push(new Particle());
function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(animateParticles);
}
animateParticles();

// --- LOGIC PARSER & MERGER ---
const picker = document.getElementById('picker');
const dropZone = document.getElementById('dropZone');
const filesList = document.getElementById('filesList');
const mergeBtn = document.getElementById('mergeBtn');
const statusBox = document.getElementById('statusBox');
const mergeAlgorithm = document.getElementById('mergeAlgorithm');
const customFileName = document.getElementById('customFileName');
const totalSizeTag = document.getElementById('totalSizeTag');
const parserStatus = document.getElementById('parserStatus');

let selectedFiles = [];

function updateClock(){ document.getElementById('clock').textContent = new Date().toTimeString().split(' ')[0]; }
setInterval(updateClock, 1000); updateClock();

function fmtSize(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1048576).toFixed(2) + ' MB';
}

function escHTML(str){ return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }

async function detectFileFormat(file) {
  const slice = await file.slice(0, 512).arrayBuffer();
  const arr = new Uint8Array(slice);
  let printable = 0;
  for(let b of arr) {
    if ((b >= 32 && b <= 126) || b === 9 || b === 10 || b === 13) printable++;
  }
  const isText = (printable / arr.length) > 0.75;
  
  if (isText) {
    const text = new TextDecoder().decode(arr).trim();
    if (text.startsWith('{') || text.startsWith('[')) return 'JSON';
    return 'SCRIPT';
  }
  return 'BIN';
}

async function renderFiles(){
  filesList.innerHTML = '';
  let totalBytes = 0;

  for(let idx = 0; idx < selectedFiles.length; idx++) {
    const file = selectedFiles[idx];
    totalBytes += file.size;
    const format = await detectFileFormat(file);

    const row = document.createElement('div');
    row.className = 'file-row';
    row.innerHTML = `
      <div class="num">${String(idx + 1).padStart(2, '0')}</div>
      <div class="info">
        <div class="name">${escHTML(file.name)}</div>
        <div class="details">
          <span>${fmtSize(file.size)}</span>
          <span class="tag-badge ${format==='JSON'?'tag-json':(format==='SCRIPT'?'tag-script':'tag-bin')}">${format}</span>
        </div>
      </div>
      <div class="file-btns">
        <button class="btn-mini" onclick="moveFile(${idx}, -1)">▲</button>
        <button class="btn-mini" onclick="moveFile(${idx}, 1)">▼</button>
        <button class="btn-mini" onclick="previewFile(${idx})">👁️ Code</button>
        <button class="btn-mini" onclick="removeFile(${idx})" style="color:var(--primary)">✕</button>
      </div>
    `;
    filesList.appendChild(row);
  }

  totalSizeTag.textContent = `Tổng: ${fmtSize(totalBytes)}`;
  mergeBtn.disabled = selectedFiles.length < 2;
  parserStatus.textContent = selectedFiles.length >= 2 ? 'READY' : 'WAITING';

  if (selectedFiles.length >= 2 && !customFileName.value) {
    customFileName.value = selectedFiles[0].name.replace(/\.bytes$/i, '') + '_merged.bytes';
  }
}

function handleFiles(fileList){
  const valid = Array.from(fileList).filter(f => f.name.toLowerCase().endsWith('.bytes'));
  selectedFiles.push(...valid);
  renderFiles();
}

dropZone.onclick = () => picker.click();
picker.onchange = (e) => { handleFiles(e.target.files); picker.value = ''; };
['dragenter', 'dragover'].forEach(evt => dropZone.addEventListener(evt, e => { e.preventDefault(); dropZone.classList.add('over'); }));
['dragleave', 'drop'].forEach(evt => dropZone.addEventListener(evt, e => { e.preventDefault(); dropZone.classList.remove('over'); }));
dropZone.addEventListener('drop', e => handleFiles(e.dataTransfer.files));

window.moveFile = (idx, dir) => {
  const target = idx + dir;
  if(target < 0 || target >= selectedFiles.length) return;
  const temp = selectedFiles[idx];
  selectedFiles[idx] = selectedFiles[target];
  selectedFiles[target] = temp;
  renderFiles();
};

window.removeFile = (idx) => {
  selectedFiles.splice(idx, 1);
  renderFiles();
};

window.previewFile = async (idx) => {
  const file = selectedFiles[idx];
  const buffer = await file.arrayBuffer();
  const arr = new Uint8Array(buffer.slice(0, 1024));
  const format = await detectFileFormat(file);

  let displayContent = '';
  if(format === 'JSON' || format === 'SCRIPT') {
    displayContent = new TextDecoder().decode(arr);
  } else {
    displayContent = Array.from(arr).map((b, i) => b.toString(16).padStart(2, '0').toUpperCase() + ((i+1)%16===0?'\n':' ')).join('');
  }

  document.getElementById('modalTitle').textContent = `CODE VIEWER: ${file.name} (${format})`;
  document.getElementById('modalBody').textContent = displayContent + (file.size > 1024 ? '\n\n...[Còn dữ liệu thêm]' : '');
  document.getElementById('previewModal').style.display = 'flex';
};

document.getElementById('closeModal').onclick = () => { document.getElementById('previewModal').style.display = 'none'; };

function encodeVarint(value) {
  const res = [];
  while (value >= 0x80) { res.push((value & 0x7f) | 0x80); value >>>= 7; }
  res.push(value & 0x7f);
  return new Uint8Array(res);
}

function showStatus(msg, type){
  statusBox.textContent = msg;
  statusBox.className = 'status-box ' + type;
}

// THUẬT TOÁN HỢP NHẤT MOD CHUYÊN DỤNG (Nối Mảng Biến Về & Tránh Đè Key)
function mergeModObjects(target, source) {
  for (const key of Object.keys(source)) {
    if (Array.isArray(target[key]) && Array.isArray(source[key])) {
      // Nối danh sách hiệu ứng biến về thay vì đè đè lên nhau
      target[key] = target[key].concat(source[key]);
    } else if (typeof target[key] === 'object' && target[key] !== null && typeof source[key] === 'object' && source[key] !== null) {
      mergeModObjects(target[key], source[key]);
    } else {
      // Nếu là thuộc tính trùng tên thuộc dạng ID Biến về, tạo key mở rộng
      if (target.hasOwnProperty(key) && (key.toLowerCase().includes('recall') || key.toLowerCase().includes('effect'))) {
        target[key + "_mod2"] = source[key];
      } else {
        target[key] = source[key];
      }
    }
  }
  return target;
}

// --- THUẬT TOÁN HỢP NHẤT MÃ NGUỒN V7 ---
mergeBtn.onclick = async () => {
  if(selectedFiles.length < 2) return;
  
  try {
    mergeBtn.disabled = true;
    parserStatus.textContent = 'PARSING...';
    showStatus('⚙️ Đang bảo vệ cấu trúc Biến Về & Hợp nhất Mod...', 'ok');

    const mode = mergeAlgorithm.value;
    let finalUint8Array = null;

    if (mode === 'smart_mod_recall') {
      let isAllJSON = true;
      let parsedJSONs = [];

      for (let file of selectedFiles) {
        const text = await file.text();
        const cleanText = text.replace(/^\uFEFF/, '').trim();
        try {
          parsedJSONs.push(JSON.parse(cleanText));
        } catch(e) {
          isAllJSON = false;
        }
      }

      if (isAllJSON) {
        // Nếu các file mod là dạng Array Root
        if (Array.isArray(parsedJSONs[0])) {
          let mergedArray = [];
          parsedJSONs.forEach(arr => {
            if(Array.isArray(arr)) mergedArray = mergedArray.concat(arr);
            else mergedArray.push(arr);
          });
          finalUint8Array = new TextEncoder().encode(JSON.stringify(mergedArray, null, 2));
        } else {
          // Dạng Object: thực hiện Smart Merge nối Mảng Recall
          let baseObj = parsedJSONs[0];
          for (let i = 1; i < parsedJSONs.length; i++) {
            mergeModObjects(baseObj, parsedJSONs[i]);
          }
          finalUint8Array = new TextEncoder().encode(JSON.stringify(baseObj, null, 2));
        }
      } else {
        // Dạng Script/Lua: Bọc Scope độc lập để biến về 2 skin không cướp hàm của nhau
        let scriptContent = "-- METADATA: COMBINED MOD RECALL SKINS\n";
        for (let i = 0; i < selectedFiles.length; i++) {
          let txt = await selectedFiles[i].text();
          txt = txt.replace(/^\uFEFF/, '').trim();
          scriptContent += `\n-- === MOD SKIN BLOCK ${i+1}: ${selectedFiles[i].name} ===\ndo\n` + txt + "\nend\n;";
        }
        finalUint8Array = new TextEncoder().encode(scriptContent);
      }
    }
    else if (mode === 'protobuf_varint') {
      const chunks = [];
      for (let file of selectedFiles) {
        const rawBuf = new Uint8Array(await file.arrayBuffer());
        const varintLen = encodeVarint(rawBuf.length);
        const packed = new Uint8Array(varintLen.length + rawBuf.length);
        packed.set(varintLen, 0);
        packed.set(rawBuf, varintLen.length);
        chunks.push(packed);
      }
      const totalLen = chunks.reduce((acc, c) => acc + c.length, 0);
      finalUint8Array = new Uint8Array(totalLen);
      let offset = 0;
      for (let c of chunks) { finalUint8Array.set(c, offset); offset += c.length; }
    }
    else if (mode === 'clean_raw') {
      let combinedStr = "";
      for (let file of selectedFiles) {
        let txt = await file.text();
        txt = txt.replace(/^\uFEFF/, '');
        combinedStr += txt + "\n;\n";
      }
      finalUint8Array = new TextEncoder().encode(combinedStr);
    }
    else { // Header preserve
      const chunks = [];
      for (let file of selectedFiles) {
        chunks.push(new Uint8Array(await file.arrayBuffer()));
      }
      const totalLen = chunks.reduce((acc, c) => acc + c.length, 0);
      finalUint8Array = new Uint8Array(totalLen);
      let offset = 0;
      for (let c of chunks) { finalUint8Array.set(c, offset); offset += c.length; }
    }

    // Tải về file kết quả
    const blob = new Blob([finalUint8Array], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    let outputName = customFileName.value.trim();
    if(!outputName.toLowerCase().endsWith('.bytes')) outputName += '.bytes';

    const a = document.createElement('a');
    a.href = url;
    a.download = outputName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    parserStatus.textContent = 'SUCCESS';
    showStatus(`🎉 ĐÃ BẢO VỆ CẢ 2 BIẾN VỀ VÀ GỘP THÀNH CÔNG! (${fmtSize(finalUint8Array.length)})`, 'ok');

  } catch (err) {
    parserStatus.textContent = 'ERROR';
    showStatus('❌ Lỗi xử lý Code: ' + err.message, 'err');
  } finally {
    mergeBtn.disabled = selectedFiles.length < 2;
  }
};
</script>
</body>
</html>
