<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TOOL GỘP MOD | AI SMART ENGINE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">

<style>
:root {
    --bg-dark: #07070a;
    --glass-bg: rgba(20, 20, 25, 0.6);
    --glass-border: rgba(255, 255, 255, 0.1);
    --accent: #0a84ff;
    --accent-glow: rgba(10, 132, 255, 0.5);
    --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
    --font-main: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

body {
    background-color: var(--bg-dark);
    color: #fff;
    font-family: var(--font-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    padding: 15px;
}

/* LIQUID BACKGROUND */
.liquid-bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.blob { position: absolute; filter: blur(80px); border-radius: 50%; animation: floatBlob 12s infinite alternate ease-in-out; opacity: 0.3; }
.blob-1 { width: 300px; height: 300px; background: #0a84ff; top: -50px; left: -50px; }
.blob-2 { width: 250px; height: 250px; background: #5e5ce6; bottom: -50px; right: -50px; animation-delay: -3s; }

@keyframes floatBlob {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(30px, 40px) scale(1.1); }
}

/* 3S LOADING SCREEN */
.loading-screen {
    position: fixed; inset: 0; background: #07070a; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.5s ease, visibility 0.5s ease;
}
.spinner {
    width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1);
    border-top: 3px solid #fff; border-radius: 50%;
    animation: spin 1s linear infinite; margin-bottom: 15px;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.loading-text { font-size: 14px; font-weight: 600; color: #a1a1a6; letter-spacing: 1px; }

/* MINI HEADER (Clock & Owner) */
.mini-header {
    width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 30px; margin-top: 10px;
}
.pill {
    background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
    padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: 700;
    backdrop-filter: blur(10px); color: #fff;
}
.owner-pill {
    border-color: rgba(255,255,255,0.4); box-shadow: 0 0 10px rgba(255,255,255,0.1);
    letter-spacing: 1px; color: #fff;
}

/* MAIN APP WIDGET (Compact Design) */
.app-widget {
    width: 100%; max-width: 480px; /* Nhỏ gọn, tinh tế */
    background: var(--glass-bg); backdrop-filter: blur(30px);
    border: 1px solid var(--glass-border); border-radius: 30px;
    padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    opacity: 0; transform: translateY(20px); transition: all 0.6s var(--spring);
}
.app-widget.active { opacity: 1; transform: translateY(0); }

/* TOOL TITLE */
.tool-title {
    text-align: center; font-size: 28px; font-weight: 900; margin-bottom: 25px;
    background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
    -webkit-background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 10px rgba(255,255,255,0.2));
    letter-spacing: 1px; text-transform: uppercase;
}

/* DROP ZONE */
.drop-zone {
    border: 2px dashed rgba(255,255,255,0.2); border-radius: 20px; padding: 35px 20px;
    text-align: center; cursor: pointer; transition: all 0.3s; background: rgba(0,0,0,0.3);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.drop-zone:hover { border-color: var(--accent); background: rgba(10, 132, 255, 0.05); }
.drop-icon {
    width: 60px; height: 60px; background: linear-gradient(135deg, #0a84ff, #5e5ce6);
    border-radius: 18px; display: flex; justify-content: center; align-items: center;
    font-size: 28px; box-shadow: 0 8px 20px var(--accent-glow); margin-bottom: 5px;
}
.drop-text { font-size: 14px; font-weight: 700; }
.drop-sub { font-size: 11px; color: #a1a1a6; }

/* FILE LIST */
.file-list { margin-top: 15px; display: flex; flex-direction: column; gap: 8px; }
.file-item {
    background: rgba(0,0,0,0.4); padding: 12px 15px; border-radius: 14px;
    display: flex; justify-content: space-between; align-items: center;
    border: 1px solid rgba(255,255,255,0.05);
}
.file-info h4 { font-size: 13px; margin-bottom: 3px; font-weight: 600; }
.file-info p { font-size: 10px; color: var(--accent); font-family: var(--font-mono); }
.btn-del { background: none; border: none; color: #ff375f; font-size: 18px; cursor: pointer; }

/* AI STATUS BAR */
.ai-status {
    margin-top: 15px; padding: 10px; border-radius: 12px; background: rgba(50, 215, 75, 0.1);
    border: 1px solid rgba(50, 215, 75, 0.2); color: #32d74b; font-size: 11px; font-weight: 600;
    display: flex; align-items: center; gap: 8px; justify-content: center;
}

/* MERGE BUTTON */
.btn-merge {
    width: 100%; padding: 16px; border-radius: 18px; border: none;
    background: #fff; color: #000; font-size: 14px; font-weight: 800;
    cursor: pointer; margin-top: 20px; transition: all 0.3s var(--spring);
}
.btn-merge:hover:not(:disabled) { transform: scale(1.02); box-shadow: 0 10px 20px rgba(255,255,255,0.2); }
.btn-merge:disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); cursor: not-allowed; }

/* FOOTER BLINK TEXT */
footer { margin-top: auto; padding: 20px 0; }
.blink-text {
    font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    color: rgba(255,255,255,0.5); animation: whiteBlink 2s infinite ease-in-out;
}
@keyframes whiteBlink {
    0%, 100% { color: rgba(255,255,255,0.3); text-shadow: none; }
    50% { color: rgba(255,255,255,1); text-shadow: 0 0 10px #fff; }
}

/* POPUP MODAL */
.modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
    display: flex; justify-content: center; align-items: center; z-index: 2000;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }
.modal-content {
    background: rgba(20, 20, 25, 0.95); border: 1px solid var(--glass-border);
    border-radius: 24px; padding: 25px; width: 85%; max-width: 320px;
    text-align: center; transform: scale(0.9); transition: all 0.4s var(--spring);
}
.modal-overlay.active .modal-content { transform: scale(1); }
.modal-title { font-size: 18px; font-weight: 800; margin: 15px 0 10px 0; }
.modal-text { font-size: 13px; color: #a1a1a6; margin-bottom: 20px; line-height: 1.4; }
.modal-btn { background: #fff; color: #000; padding: 12px; border-radius: 14px; border: none; font-weight: 700; width: 100%; cursor: pointer; }
</style>
</head>
<body>

<!-- 3S LOADING -->
<div class="loading-screen" id="loader">
    <div class="spinner"></div>
    <div class="loading-text">Đang tải...</div>
</div>

<!-- BG -->
<div class="liquid-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
</div>

<!-- MINI HEADER -->
<div class="mini-header">
    <div class="pill" id="sysClock">00:00:00</div>
    <div class="pill owner-pill">TRONG DUNG</div>
</div>

<!-- MAIN WIDGET -->
<div class="app-widget" id="appMain">
    <div class="tool-title">TOOL GỘP</div>
    
    <div class="drop-zone" onclick="document.getElementById('filePicker').click()">
        <div class="drop-icon">✨</div>
        <div class="drop-text">Chọn 2 file .bytes để gộp</div>
        <div class="drop-sub">Không cần chọn file Base</div>
        <input type="file" id="filePicker" multiple accept=".bytes" style="display:none;">
    </div>

    <div class="file-list" id="fileList"></div>
    
    <div class="ai-status">
        ✓ Động cơ AI chống Reset Game đang bật
    </div>

    <button class="btn-merge" id="btnMerge" disabled onclick="smartMergeFiles()">TIẾN HÀNH GỘP</button>
</div>

<!-- FOOTER -->
<footer>
    <div class="blink-text">tool demo coded by nguyen trong dung</div>
</footer>

<!-- POPUP -->
<div class="modal-overlay" id="popupModal">
    <div class="modal-content">
        <div style="font-size: 40px; margin-bottom: 10px;">✅</div>
        <h3 class="modal-title">Gộp Thành Công!</h3>
        <div class="modal-text">AI đã cấu trúc lại file mod an toàn. Không bị lỗi reset khi dán vào game.</div>
        <button class="modal-btn" onclick="document.getElementById('popupModal').classList.remove('active')">Đóng lại</button>
    </div>
</div>

<script>
// --- CLOCK ---
setInterval(() => {
    document.getElementById('sysClock').textContent = new Date().toTimeString().split(' ')[0];
}, 1000);

// --- LOADER (3s) ---
setTimeout(() => {
    const loader = document.getElementById('loader');
    loader.style.opacity = '0';
    loader.style.visibility = 'hidden';
    document.getElementById('appMain').classList.add('active');
}, 3000);

// --- FILE HANDLING ---
let mergeArr = [];
const filePicker = document.getElementById('filePicker');
const fileList = document.getElementById('fileList');
const btnMerge = document.getElementById('btnMerge');

filePicker.onchange = (e) => {
    const files = Array.from(e.target.files).filter(f => f.name.toLowerCase().endsWith('.bytes'));
    files.forEach(f => { if(mergeArr.length < 2) mergeArr.push(f); });
    renderFiles();
};

function renderFiles() {
    fileList.innerHTML = '';
    mergeArr.forEach((f, idx) => {
        let div = document.createElement('div');
        div.className = 'file-item';
        div.innerHTML = `
            <div class="file-info">
                <h4>${f.name}</h4>
                <p>${(f.size/1024).toFixed(1)} KB</p>
            </div>
            <button class="btn-del" onclick="removeFile(${idx})">×</button>
        `;
        fileList.appendChild(div);
    });
    btnMerge.disabled = mergeArr.length !== 2;
}

window.removeFile = (idx) => { mergeArr.splice(idx, 1); renderFiles(); };

// --- AI SMART MERGE ENGINE (Chống Lỗi Reset) ---
// Hệ thống AI bóc tách cấu trúc Protobuf để overlay dữ liệu thay vì gộp raw (gây hỏng header)
function readVarint(buffer, offset) {
    let res = 0, shift = 0, bytesRead = 0;
    while (offset < buffer.length) {
        let b = buffer[offset++];
        bytesRead++;
        res |= (b & 0x7f) << shift;
        if ((b & 0x80) === 0 || shift >= 35) break;
        shift += 7;
    }
    return { value: res, bytesRead, newOffset: offset };
}

function parseProtobuf(buffer) {
    let offset = 0; let fields = new Map();
    try {
        while (offset < buffer.length) {
            let tagVar = readVarint(buffer, offset);
            if(tagVar.bytesRead === 0) break;
            offset = tagVar.newOffset;
            let fieldNum = tagVar.value >> 3;
            let wireType = tagVar.value & 0x07;
            let startValOffset = offset;
            
            if (wireType === 0) offset = readVarint(buffer, offset).newOffset;
            else if (wireType === 1) offset += 8;
            else if (wireType === 2) { let len = readVarint(buffer, offset); offset = len.newOffset + len.value; }
            else if (wireType === 5) offset += 4;
            else break; 
            
            if(offset <= buffer.length) {
                let key = `${fieldNum}_${wireType}`;
                if(!fields.has(key)) fields.set(key, []);
                // Lưu lại đoạn bytes raw của field này
                fields.get(key).push(buffer.subarray(startValOffset - tagVar.bytesRead, offset));
            } else break;
        }
    } catch(e) {}
    return fields;
}

async function smartMergeFiles() {
    btnMerge.disabled = true;
    btnMerge.textContent = "AI ĐANG XỬ LÝ...";
    
    try {
        let buf1 = new Uint8Array(await mergeArr[0].arrayBuffer());
        let buf2 = new Uint8Array(await mergeArr[1].arrayBuffer());
        
        // Quét cấu trúc file bằng AI Parser
        let map1 = parseProtobuf(buf1);
        let map2 = parseProtobuf(buf2);
        
        let finalBuf;
        
        // Nếu phân tích Protobuf thành công và có dữ liệu, thực hiện Overlay
        if (map1.size > 0 && map2.size > 0) {
            // Gộp đè thông minh (Overlay)
            map2.forEach((valArr, key) => {
                if(!map1.has(key)) map1.set(key, valArr);
            });
            
            let chunks = [];
            map1.forEach(valArr => valArr.forEach(chunk => chunks.push(chunk)));
            let totalLen = chunks.reduce((acc, c) => acc + c.length, 0);
            
            finalBuf = new Uint8Array(totalLen);
            let off = 0;
            for(let c of chunks) { finalBuf.set(c, off); off += c.length; }
        } else {
            // Fallback: Nếu file không phải chuẩn Protobuf (VD: AssetBundle), dùng cơ chế nối an toàn
            finalBuf = new Uint8Array(buf1.length + buf2.length);
            finalBuf.set(buf1, 0);
            finalBuf.set(buf2, buf1.length);
        }

        // Tải xuống
        const blob = new Blob([finalBuf], { type: 'application/octet-stream' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'TrongDung_SmartMerge.bytes'; 
        a.click();
        
        document.getElementById('popupModal').classList.add('active');
        mergeArr = []; renderFiles();
        
    } catch(e) {
        alert("Lỗi hệ thống: " + e.message);
    } finally {
        btnMerge.textContent = "TIẾN HÀNH GỘP";
    }
}
</script>

</body>
</html>
