<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER RE-PACKER V10 CLASSIC | TRỌNG DŨNG</title>
<style>
    :root {
        --bg: #121212;
        --surface: #1e1e1e;
        --primary: #00e5ff;
        --text: #e0e0e0;
        --border: #333;
    }
    * { box-sizing: border-box; font-family: 'Consolas', monospace; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
    h1 { color: var(--primary); margin: 0 0 10px 0; letter-spacing: 2px; }
    .dev-info { color: #888; font-size: 14px; }
    .panel { background: var(--surface); border: 1px solid var(--border); padding: 20px; margin-bottom: 20px; border-radius: 8px; }
    .panel h2 { margin-top: 0; color: var(--primary); font-size: 18px; border-bottom: 1px dashed var(--border); padding-bottom: 10px; }
    .drop-zone { border: 2px dashed #555; padding: 40px 20px; text-align: center; cursor: pointer; background: #1a1a1a; border-radius: 8px; transition: 0.2s; }
    .drop-zone:hover { border-color: var(--primary); background: #222; }
    .file-list { margin-top: 15px; }
    .file-item { display: flex; justify-content: space-between; padding: 10px; background: #2a2a2a; margin-bottom: 5px; border-radius: 4px; border-left: 3px solid var(--primary); }
    button { background: var(--primary); color: #000; border: none; padding: 12px 20px; font-weight: bold; cursor: pointer; width: 100%; border-radius: 4px; font-size: 16px; margin-top: 10px; }
    button:disabled { background: #444; color: #888; cursor: not-allowed; }
    button:hover:not(:disabled) { opacity: 0.9; }
    .status { margin-top: 15px; text-align: center; font-weight: bold; color: #4caf50; }
    .contact { text-align: center; margin-top: 40px; font-size: 14px; color: #888; }
    .contact a { color: var(--primary); text-decoration: none; }
</style>
</head>
<body>

<div class="container">
    <header>
        <h1>CYBER RE-PACKER V10</h1>
        <div class="dev-info">Developer: TRỌNG DŨNG | Classic Core Engine</div>
    </header>

    <div class="panel">
        <h2>📦 1. Gộp File Mod (.bytes)</h2>
        <div class="drop-zone" id="mergeDrop" onclick="document.getElementById('mergePicker').click()">
            <p>Click hoặc Kéo thả các file .bytes cần gộp vào đây</p>
            <input type="file" id="mergePicker" multiple accept=".bytes" style="display:none;" onchange="handleMergeFiles(this.files)">
        </div>
        <div class="file-list" id="mergeList"></div>
        <button id="btnMerge" disabled onclick="mergeFiles()">TIẾN HÀNH GỢP FILE</button>
        <div id="mergeStatus" class="status"></div>
    </div>

    <div class="panel">
        <h2>🔑 2. Giải Mã Ký Tự Rác (Lua/Bytes)</h2>
        <div class="drop-zone" id="decryptDrop" onclick="document.getElementById('decryptPicker').click()">
            <p>Click để chọn file bị mã hóa (Lua/Bytes)</p>
            <input type="file" id="decryptPicker" style="display:none;" onchange="handleDecryptFile(this.files)">
        </div>
        <div id="decryptFileInfo" style="margin-top: 10px; color: var(--primary); text-align: center;"></div>
        <button id="btnDecrypt" disabled onclick="decryptFile()">GIẢI MÃ THÀNH CHỮ THƯỜNG</button>
        <div id="decryptStatus" class="status"></div>
    </div>

    <div class="contact">
        Báo cáo lỗi qua Zalo: <a href="https://zalo.me/0836376886" target="_blank">0836376886</a> | Email: hfvvfrgg@gmail.com
    </div>
</div>

<script>
    // --- GỘP FILE MOD ---
    let filesToMerge = [];
    
    function handleMergeFiles(files) {
        Array.from(files).forEach(f => filesToMerge.push(f));
        renderMergeList();
    }

    function renderMergeList() {
        const list = document.getElementById('mergeList');
        list.innerHTML = '';
        filesToMerge.forEach((f, i) => {
            list.innerHTML += `<div class="file-item">
                <span>${f.name} (${(f.size/1024).toFixed(1)} KB)</span>
                <span style="color: #ff5252; cursor: pointer;" onclick="removeFile(${i})">Xóa</span>
            </div>`;
        });
        document.getElementById('btnMerge').disabled = filesToMerge.length < 2;
    }

    function removeFile(index) {
        filesToMerge.splice(index, 1);
        renderMergeList();
    }

    async function mergeFiles() {
        document.getElementById('mergeStatus').innerText = "Đang xử lý...";
        document.getElementById('btnMerge').disabled = true;
        
        try {
            let totalSize = filesToMerge.reduce((acc, f) => acc + f.size, 0);
            let mergedBuffer = new Uint8Array(totalSize);
            let offset = 0;
            
            for(let file of filesToMerge) {
                let buf = new Uint8Array(await file.arrayBuffer());
                mergedBuffer.set(buf, offset);
                offset += buf.length;
            }
            
            const blob = new Blob([mergedBuffer], { type: 'application/octet-stream' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'V10_Merged.bytes';
            a.click();
            
            document.getElementById('mergeStatus').innerText = "✅ Gộp file thành công!";
        } catch (e) {
            document.getElementById('mergeStatus').innerText = "❌ Lỗi: " + e.message;
            document.getElementById('mergeStatus').style.color = "#ff5252";
        } finally {
            document.getElementById('btnMerge').disabled = false;
        }
    }

    // --- GIẢI MÃ CHỮ THƯỜNG ---
    let targetDecryptFile = null;

    function handleDecryptFile(files) {
        if(files.length > 0) {
            targetDecryptFile = files[0];
            document.getElementById('decryptFileInfo').innerText = `Đã chọn: ${targetDecryptFile.name}`;
            document.getElementById('btnDecrypt').disabled = false;
        }
    }

    async function decryptFile() {
        if(!targetDecryptFile) return;
        document.getElementById('decryptStatus').innerText = "Đang bóc tách...";
        document.getElementById('btnDecrypt').disabled = true;

        try {
            let buf = new Uint8Array(await targetDecryptFile.arrayBuffer());
            let rawString = new TextDecoder('utf-8', {fatal: false}).decode(buf);
            let cleanString = "";
            
            for(let i=0; i<rawString.length; i++) {
                let code = rawString.charCodeAt(i);
                if(code === 10 || code === 13 || (code >= 32 && code <= 126)) {
                    cleanString += rawString[i];
                } else if(cleanString.length > 0 && cleanString[cleanString.length-1] !== ' ') {
                    cleanString += ' ';
                }
            }
            
            let finalOutput = cleanString.toLowerCase().trim();
            const blob = new Blob([finalOutput], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = targetDecryptFile.name + '_V10_Decrypted.txt';
            a.click();

            document.getElementById('decryptStatus').innerText = "✅ Giải mã Text thành công!";
        } catch (e) {
            document.getElementById('decryptStatus').innerText = "❌ Lỗi: " + e.message;
            document.getElementById('decryptStatus').style.color = "#ff5252";
        } finally {
            document.getElementById('btnDecrypt').disabled = false;
        }
    }

    // Kéo thả files
    const dropMerge = document.getElementById('mergeDrop');
    dropMerge.addEventListener('dragover', (e) => { e.preventDefault(); dropMerge.style.borderColor = '#00e5ff'; });
    dropMerge.addEventListener('dragleave', (e) => { e.preventDefault(); dropMerge.style.borderColor = '#555'; });
    dropMerge.addEventListener('drop', (e) => { e.preventDefault(); dropMerge.style.borderColor = '#555'; handleMergeFiles(e.dataTransfer.files); });
</script>
</body>
</html>
