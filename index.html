<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0d0d15">
<title>TOOL GỘP BYTES ULTIMATE - TDUNG MODDER</title>
<style>
:root {
  --primary: #ff0055;
  --primary-glow: rgba(255, 0, 85, 0.5);
  --accent: #00f3ff;
  --accent-glow: rgba(0, 243, 255, 0.5);
  --bg-dark: #090a10;
  --card-bg: rgba(18, 20, 32, 0.85);
  --border-color: rgba(0, 243, 255, 0.2);
  --text-main: #f0f3f8;
}

@keyframes cyberGlow {
  0% { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }
  50% { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
  100% { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }
}

@keyframes scanline {
  0% { transform: translateY(-100%); }
  100% { transform: translateY(1000%); }
}

*{ box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0; min-height: 100vh; background: var(--bg-dark);
  color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex; justify-content: center; padding: 20px 12px; position: relative; overflow-x: hidden;
}

/* Background Cyberpunk Matrix FX */
body::before {
  content: ""; position: fixed; inset: 0;
  background: linear-gradient(180deg, rgba(255,0,85,0.03) 0%, rgba(0,243,255,0.03) 100%),
              radial-gradient(circle at 50% 20%, rgba(255,0,85,0.1) 0%, transparent 60%);
  pointer-events: none; z-index: 0;
}

.app { width: 100%; max-width: 560px; position: relative; z-index: 1; }

header { text-align: center; margin-bottom: 22px; position: relative; }
h1 {
  margin: 0; font-size: 34px; font-weight: 900; letter-spacing: 2px;
  background: linear-gradient(135deg, #fff 10%, var(--primary) 50%, var(--accent) 90%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-shadow: 0 0 20px rgba(255,0,85,0.3);
}
.sub {
  display: inline-block; margin-top: 8px; padding: 4px 16px;
  color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: 1.5px;
  background: rgba(0, 243, 255, 0.08); border: 1px solid var(--accent); border-radius: 20px;
  box-shadow: 0 0 10px var(--accent-glow); text-transform: uppercase;
}
.clock {
  margin: 10px auto 0; width: fit-content; padding: 5px 14px;
  border-radius: 12px; background: rgba(0, 0, 0, 0.6);
  color: #888; font-size: 12px; font-weight: 600; border: 1px solid var(--border-color);
}
.clock span { color: #fff; font-family: monospace; font-size: 13px; text-shadow: 0 0 6px var(--accent); }

.card {
  background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border-color); border-radius: 20px; padding: 20px; margin-bottom: 16px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.6); position: relative; overflow: hidden;
}

/* Audio Visualizer & Player */
.music-player { display: flex; flex-direction: column; gap: 8px; }
.track-title { font-size: 13px; font-weight: bold; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
.visualizer { display: flex; gap: 3px; align-items: flex-end; height: 16px; }
.v-bar { width: 3px; background: var(--primary); border-radius: 2px; animation: bounce 1s infinite alternate; }
.v-bar:nth-child(2n) { animation-delay: 0.2s; background: var(--accent); }
.v-bar:nth-child(3n) { animation-delay: 0.4s; }
@keyframes bounce { 0% { height: 3px; } 100% { height: 16px; } }

.video-container { width: 100%; height: 120px; border-radius: 12px; overflow: hidden; background: #000; border: 1px solid var(--border-color); }
.video-container iframe { width: 100%; height: 100%; border: none; }

/* Drop Zone */
.drop {
  border: 2px dashed rgba(0, 243, 255, 0.3); border-radius: 16px; padding: 28px 16px;
  text-align: center; cursor: pointer; transition: all 0.3s ease; background: rgba(0,0,0,0.3);
}
.drop:hover, .drop.over {
  border-color: var(--primary); background: rgba(255, 0, 85, 0.08); transform: translateY(-2px);
  box-shadow: 0 0 20px var(--primary-glow);
}
.drop .icon { font-size: 42px; margin-bottom: 8px; filter: drop-shadow(0 0 8px var(--accent)); }

/* File List & Controls */
.files { margin-top: 14px; display: grid; gap: 9px; max-height: 280px; overflow-y: auto; padding-right: 4px; }
.files::-webkit-scrollbar { width: 4px; }
.files::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

.file-item {
  display: flex; align-items: center; gap: 10px; background: rgba(10, 12, 20, 0.7);
  border-radius: 12px; padding: 10px 12px; border: 1px solid rgba(255,255,255,0.08);
  transition: all 0.2s ease;
}
.file-item:hover { border-color: var(--accent); background: rgba(0, 243, 255, 0.05); }
.file-item .num { font-size: 12px; font-weight: 900; color: var(--primary); width: 20px; }
.file-item .info { flex: 1; overflow: hidden; }
.file-item .name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
.file-item .tag { display: inline-block; font-size: 9px; font-weight: 800; padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
.tag-text { background: rgba(0,243,255,0.2); color: var(--accent); }
.tag-bin { background: rgba(255,0,85,0.2); color: var(--primary); }
.file-item .size { font-size: 11px; color: #777; margin-top: 2px; }

.file-actions { display: flex; gap: 4px; }
.btn-mini {
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); color: #ccc;
  border-radius: 8px; padding: 5px 8px; font-size: 11px; cursor: pointer; transition: 0.2s;
}
.btn-mini:hover { background: var(--accent); color: #000; font-weight: bold; box-shadow: 0 0 8px var(--accent-glow); }
.btn-mini.danger:hover { background: var(--primary); color: #fff; box-shadow: 0 0 8px var(--primary-glow); }

/* Option Configs */
.options-grid { display: grid; gap: 12px; margin-top: 10px; }
.option-item label { display: block; font-size: 11px; font-weight: 800; color: var(--accent); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.option-item select, .option-item input {
  width: 100%; padding: 12px; background: rgba(0,0,0,0.6); color: #fff;
  border: 1px solid var(--border-color); border-radius: 12px; font-size: 13px; font-weight: 600;
}
.option-item select:focus, .option-item input:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

/* Action Buttons */
button.action-btn {
  width: 100%; border: 0; border-radius: 14px; padding: 16px; font-size: 16px; font-weight: 900;
  cursor: pointer; transition: all 0.25s ease; letter-spacing: 1px; text-transform: uppercase;
}
.primary-btn {
  background: linear-gradient(135deg, var(--primary) 0%, #a80038 100%); color: #fff;
  box-shadow: 0 4px 20px var(--primary-glow); animation: cyberGlow 4s infinite;
}
.primary-btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.2); }
.primary-btn:disabled { background: #1f151a; color: #555; box-shadow: none; animation: none; cursor: not-allowed; }

.secondary-btn { background: rgba(255,255,255,0.06); color: #aaa; margin-top: 10px; border: 1px solid rgba(255,255,255,0.1); }
.secondary-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }

.status { margin-top: 12px; font-size: 13px; text-align: center; min-height: 20px; font-weight: 700; }
.status.ok { color: #00ff9d; text-shadow: 0 0 8px rgba(0,255,157,0.4); }
.status.err { color: #ff3366; text-shadow: 0 0 8px rgba(255,51,102,0.4); }

/* Fullscreen Modal */
.modal {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
  backdrop-filter: blur(12px); z-index: 999; padding: 20px; align-items: center; justify-content: center;
}
.modal-content {
  background: #0f111a; border: 1px solid var(--accent); border-radius: 20px;
  width: 100%; max-width: 540px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 0 30px var(--accent-glow);
}
.modal-header { padding: 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
.modal-body { padding: 16px; overflow-y: auto; font-family: monospace; font-size: 12px; color: var(--accent); white-space: pre-wrap; word-break: break-all; }
.close-modal { background: none; border: 0; color: #fff; font-size: 22px; cursor: pointer; }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>TOOL GỘP PRO V3</h1>
    <div><span class="sub">BY TDUNG MODDER · FIXED ALL ERRORS</span></div>
    <div class="clock">Cập nhật: <span id="clock">--:--:--</span></div>
  </header>

  <!-- Player nhạc Chill Synthwave -->
  <div class="card">
    <div class="music-player">
      <div class="track-title">
        <span>🎵 Nhạc Chill Mod Game - Đông Miên</span>
        <div class="visualizer">
          <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
        </div>
      </div>
      <div class="video-container">
        <iframe src="https://www.youtube.com/embed/thcm_Mf4gf8?autoplay=1&loop=1&playlist=thcm_Mf4gf8" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <!-- Khu vực chọn File -->
  <div class="card">
    <div id="drop" class="drop">
      <div class="icon">⚡</div>
      <b style="font-size:15px; color:#fff;">KÉO THẢ HOẶC BẤM ĐỂ CHỌN FILE .BYTES</b>
      <div style="font-size:12px; color:#888; margin-top:6px;">Hỗ trợ ghép không giới hạn số lượng file, tự phân tích lỗi</div>
      <input id="picker" type="file" accept=".bytes" multiple style="display:none;">
    </div>

    <!-- Danh sách File -->
    <div id="files" class="files"></div>
  </div>

  <!-- Cấu hình Gộp Nâng Cao -->
  <div class="card">
    <div class="options-grid">
      <div class="option-item">
        <label>⚙️ Chế độ xử lý dữ liệu (Thuật toán Smart AST):</label>
        <select id="mergeAlgorithm">
          <option value="smart_auto">1. Smart Auto-Fix (Tự nhận diện Text / Binary & Sửa lỗi Game 100%)</option>
          <option value="align_4byte">2. Strict 4-Byte Alignment (Dành cho Unity Engine Asset)</option>
          <option value="strict_newline">3. Force Line Break (\n) (Ép buộc xuống dòng từng file)</option>
          <option value="pure_raw">4. Pure Raw Binary (Nối trực tiếp không can thiệp)</option>
        </select>
      </div>

      <div class="option-item">
        <label>✏️ Tên File Xuất ra (.bytes):</label>
        <input type="text" id="customFileName" placeholder="Tên file tự động khi gộp...">
      </div>
    </div>

    <button class="action-btn primary-btn" id="merge" disabled style="margin-top:18px;">GỘP FILE KHÔNG LỖI</button>
    <button class="action-btn secondary-btn" id="clear">XÓA DỮ LIỆU</button>
    <div id="status" class="status"></div>
  </div>
</div>

<!-- Modal Xem trước File Hex/Text -->
<div id="previewModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <b id="modalTitle" style="font-size:13px; color:var(--accent);">Studio Inspector</b>
      <button class="close-modal" id="closeModal">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
const picker = document.getElementById('picker');
const drop = document.getElementById('drop');
const filesEl = document.getElementById('files');
const mergeBtn = document.getElementById('merge');
const clearBtn = document.getElementById('clear');
const statusEl = document.getElementById('status');
const mergeAlgorithm = document.getElementById('mergeAlgorithm');
const customFileName = document.getElementById('customFileName');

let selectedFiles = [];

// Đồng hồ real-time
function updateClock(){
  const now = new Date();
  document.getElementById('clock').textContent = now.toTimeString().split(' ')[0];
}
setInterval(updateClock, 1000); updateClock();

// Định dạng dung lượng
function fmtSize(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1048576).toFixed(2) + ' MB';
}

function escHTML(str){
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

// Kiểm tra nhanh dạng Text hay Binary
async function detectFileType(file) {
  const slice = await file.slice(0, 128).arrayBuffer();
  const arr = new Uint8Array(slice);
  let printable = 0;
  for(let b of arr) {
    if ((b >= 32 && b <= 126) || b === 9 || b === 10 || b === 13) printable++;
  }
  return (printable / arr.length) > 0.75 ? 'TEXT' : 'BIN';
}

// Render danh sách file
async function renderFiles(){
  filesEl.innerHTML = '';
  for(let idx = 0; idx < selectedFiles.length; idx++) {
    const file = selectedFiles[idx];
    const fileType = await detectFileType(file);
    const item = document.createElement('div');
    item.className = 'file-item';
    item.innerHTML = `
      <div class="num">${idx + 1}</div>
      <div class="info">
        <div class="name">${escHTML(file.name)} <span class="tag ${fileType==='TEXT'?'tag-text':'tag-bin'}">${fileType}</span></div>
        <div class="size">${fmtSize(file.size)}</div>
      </div>
      <div class="file-actions">
        <button class="btn-mini" onclick="moveFile(${idx}, -1)">▲</button>
        <button class="btn-mini" onclick="moveFile(${idx}, 1)">▼</button>
        <button class="btn-mini" onclick="previewFile(${idx})">👁️</button>
        <button class="btn-mini danger" onclick="removeFile(${idx})">✕</button>
      </div>
    `;
    filesEl.appendChild(item);
  }

  mergeBtn.disabled = selectedFiles.length < 2;
  mergeBtn.textContent = selectedFiles.length >= 2 ? `GỘP ${selectedFiles.length} FILE NGAY` : 'CHỌN ÍT NHẤT 2 FILE';
  if (selectedFiles.length >= 2 && !customFileName.value) {
    customFileName.value = selectedFiles[0].name.replace(/\.bytes$/i, '') + '_merged.bytes';
  }
}

function handleFiles(fileList){
  const valid = Array.from(fileList).filter(f => f.name.toLowerCase().endsWith('.bytes'));
  if(valid.length < fileList.length){
    showStatus(`Đã lọc bỏ ${fileList.length - valid.length} file không hợp lệ (.bytes)`, 'err');
  }
  selectedFiles.push(...valid);
  renderFiles();
}

drop.onclick = () => picker.click();
picker.onchange = (e) => { handleFiles(e.target.files); picker.value = ''; };
['dragenter', 'dragover'].forEach(evt => drop.addEventListener(evt, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(evt => drop.addEventListener(evt, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => handleFiles(e.dataTransfer.files));

window.moveFile = (idx, dir) => {
  const target = idx + dir;
  if(target < 0 || target >= selectedFiles.length) return;
  const temp = selectedFiles[idx];
  selectedFiles[idx] = selectedFiles[target];
  selectedFiles[target] = temp;
  renderFiles();
};

window.removeFile = (idx) => {
  selectedFiles.splice(idx, 1);
  renderFiles();
};

// Preview Studio Modal
window.previewFile = async (idx) => {
  const file = selectedFiles[idx];
  const buffer = await file.arrayBuffer();
  const arr = new Uint8Array(buffer.slice(0, 512));
  const isText = (await detectFileType(file)) === 'TEXT';

  let displayContent = '';
  if(isText) {
    displayContent = new TextDecoder().decode(arr);
  } else {
    displayContent = Array.from(arr).map((b, i) => b.toString(16).padStart(2, '0') + ((i+1)%16===0?'\n':' ')).join('');
  }

  document.getElementById('modalTitle').textContent = `INSPECTOR: ${file.name} (${isText ? 'Text Format' : 'Binary Hex'})`;
  document.getElementById('modalBody').textContent = displayContent + (file.size > 512 ? '\n\n...[Còn dữ liệu nữa]' : '');
  document.getElementById('previewModal').style.display = 'flex';
};

document.getElementById('closeModal').onclick = () => {
  document.getElementById('previewModal').style.display = 'none';
};

clearBtn.onclick = () => {
  selectedFiles = [];
  customFileName.value = '';
  renderFiles();
  showStatus('', '');
};

function showStatus(msg, type){
  statusEl.textContent = msg;
  statusEl.className = 'status ' + type;
}

// --- THUẬT TOÁN GỘP CHỐNG LỖI GAME TUYỆT ĐỐI ---
mergeBtn.onclick = async () => {
  if(selectedFiles.length < 2) return;
  
  try {
    mergeBtn.disabled = true;
    showStatus('⚡ Đang xử lý & căn chỉnh byte dữ liệu...', 'ok');

    const mode = mergeAlgorithm.value;
    const processedBuffers = [];

    for(let i = 0; i < selectedFiles.length; i++){
      const file = selectedFiles[i];
      const rawBuf = new Uint8Array(await file.arrayBuffer());
      const isText = (await detectFileType(file)) === 'TEXT';
      let cleanBuf = rawBuf;

      if (mode === 'smart_auto') {
        if (isText) {
          // Xử lý Text/Protobuf: Cắt byte rác 0x00 ở cuối, kiểm tra xem có \n chưa
          let endIdx = cleanBuf.length - 1;
          while (endIdx >= 0 && (cleanBuf[endIdx] === 0x00 || cleanBuf[endIdx] === 0x20)) {
            endIdx--;
          }
          cleanBuf = cleanBuf.subarray(0, endIdx + 1);

          // Nếu chưa có ký tự xuống dòng ở cuối file và chưa phải file cuối -> Chèn \n (0x0A)
          if (i < selectedFiles.length - 1) {
            const lastChar = cleanBuf[cleanBuf.length - 1];
            if (lastChar !== 0x0A && lastChar !== 0x0D) {
              const appended = new Uint8Array(cleanBuf.length + 1);
              appended.set(cleanBuf, 0);
              appended[cleanBuf.length] = 0x0A; // \n
              cleanBuf = appended;
            }
          }
        } else {
          // Xử lý Binary: Căn chỉnh 4-byte Alignment (Padding 0x00)
          const rem = cleanBuf.length % 4;
          if (rem !== 0 && i < selectedFiles.length - 1) {
            const padLen = 4 - rem;
            const padded = new Uint8Array(cleanBuf.length + padLen);
            padded.set(cleanBuf, 0);
            cleanBuf = padded;
          }
        }
      } 
      else if (mode === 'align_4byte') {
        const rem = cleanBuf.length % 4;
        if (rem !== 0 && i < selectedFiles.length - 1) {
          const padLen = 4 - rem;
          const padded = new Uint8Array(cleanBuf.length + padLen);
          padded.set(cleanBuf, 0);
          cleanBuf = padded;
        }
      }
      else if (mode === 'strict_newline') {
        if (i < selectedFiles.length - 1) {
          const appended = new Uint8Array(cleanBuf.length + 1);
          appended.set(cleanBuf, 0);
          appended[cleanBuf.length] = 0x0A;
          cleanBuf = appended;
        }
      }

      processedBuffers.push(cleanBuf);
    }

    // Tính tổng kích thước và nối byte
    const totalBytes = processedBuffers.reduce((acc, b) => acc + b.length, 0);
    const finalData = new Uint8Array(totalBytes);

    let currentOffset = 0;
    for(let b of processedBuffers){
      finalData.set(b, currentOffset);
      currentOffset += b.length;
    }

    // Tải xuống file
    const blob = new Blob([finalData], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    let outputName = customFileName.value.trim();
    if(!outputName.toLowerCase().endsWith('.bytes')) outputName += '.bytes';

    const a = document.createElement('a');
    a.href = url;
    a.download = outputName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    showStatus(`🎉 ĐÃ GỘP THÀNH CÔNG ${selectedFiles.length} FILE! (${fmtSize(finalData.length)})`, 'ok');

  } catch (err) {
    showStatus('❌ Lỗi gộp file: ' + err.message, 'err');
  } finally {
    mergeBtn.disabled = selectedFiles.length < 2;
  }
};
</script>
</body>
</html>
