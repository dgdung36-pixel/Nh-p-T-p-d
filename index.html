<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FILE MOD LQ - TRONG DUNG</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            base: '#07080c',
                            card: '#101420',
                            input: '#161b2b',
                            border: '#22293e'
                        },
                        neon: {
                            blue: '#00f0ff',
                            pink: '#ff007f',
                            purple: '#7000ff',
                            green: '#00ff66'
                        }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #06070a;
            color: #e2e8f0;
            font-family: 'Rajdhani', sans-serif;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.15), transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(255, 0, 127, 0.08), transparent 50%);
            background-attachment: fixed;
        }

        .neon-name {
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #00f0ff 0%, #ff007f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 18px rgba(0, 240, 255, 0.6);
            animation: pulseGlow 2.5s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.9; text-shadow: 0 0 12px rgba(0, 240, 255, 0.7); }
            100% { opacity: 1; text-shadow: 0 0 25px rgba(0, 240, 255, 1), 0 0 35px rgba(255, 0, 127, 0.8); }
        }

        .glass-card {
            background: rgba(16, 20, 32, 0.85);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(34, 41, 62, 0.8);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
        }

        .btn-neon-blue {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            box-shadow: 0 0 15px rgba(0, 198, 255, 0.35);
            transition: all 0.25s ease;
        }
        .btn-neon-blue:hover {
            box-shadow: 0 0 22px rgba(0, 198, 255, 0.75);
            transform: translateY(-2px);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #07080c;
        }
        ::-webkit-scrollbar-thumb {
            background: #22293e;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00f0ff;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- HEADER SECTION -->
    <header class="pt-8 pb-4 px-4 text-center relative max-w-xl mx-auto">
        <!-- Live Clock -->
        <div class="inline-flex items-center gap-2 bg-dark-card border border-dark-border px-4 py-1.5 rounded-full mb-5 shadow-lg">
            <i class="fa-regular fa-clock text-neon-blue animate-pulse"></i>
            <span id="liveClock" class="font-orbitron text-xs font-bold tracking-widest text-gray-200">00:00:00 - 01/01/2026</span>
        </div>

        <!-- Neon Name -->
        <div class="mb-3">
            <h1 class="neon-name text-3xl sm:text-4xl font-black tracking-wider uppercase">TRONG DUNG</h1>
        </div>

        <!-- Web Title -->
        <div class="text-center mb-4">
            <h2 class="font-orbitron text-2xl font-black tracking-wide text-white inline-flex items-center gap-2">
                FILE MOD LQ
                <span class="text-xs font-normal px-2 py-0.5 rounded bg-neon-blue/20 text-neon-blue border border-neon-blue/30">VIP</span>
            </h2>
            <p class="text-xs text-gray-400 font-medium tracking-wider uppercase mt-1">MOD IOS & MOD ADR</p>
        </div>

        <!-- Social Icons -->
        <div class="flex justify-center items-center gap-3 mt-2">
            <!-- Youtube Button -->
            <a href="https://youtube.com/@trdunxx?si=tGWPnDMwmzyX1BaU" target="_blank" rel="noopener noreferrer" class="w-10 h-10 rounded-xl bg-red-600/20 border border-red-500/40 text-red-500 hover:bg-red-600 hover:text-white flex items-center justify-center transition-all shadow-lg hover:shadow-red-600/50" title="Kênh YouTube TRONG DUNG">
                <i class="fa-brands fa-youtube text-lg"></i>
            </a>
            <!-- Telegram Button -->
            <a href="#" target="_blank" rel="noopener noreferrer" class="w-10 h-10 rounded-xl bg-sky-500/20 border border-sky-400/40 text-sky-400 hover:bg-sky-500 hover:text-white flex items-center justify-center transition-all shadow-lg hover:shadow-sky-500/50" title="Telegram">
                <i class="fa-brands fa-telegram text-lg"></i>
            </a>
            <!-- Zalo Button -->
            <a href="#" target="_blank" rel="noopener noreferrer" class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/40 text-blue-400 hover:bg-blue-600 hover:text-white flex items-center justify-center font-bold text-xs transition-all shadow-lg hover:shadow-blue-600/50" title="Zalo">
                ZALO
            </a>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-xl mx-auto px-4 mt-4">

        <!-- OS Switcher Tabs -->
        <div class="grid grid-cols-2 gap-3 mb-6 p-1.5 glass-card rounded-2xl">
            <button id="tabIosBtn" onclick="switchPlatform('ios')" class="py-3 rounded-xl font-orbitron font-bold text-sm tracking-wider flex items-center justify-center gap-2 transition-all bg-gradient-to-r from-neon-blue to-blue-600 text-white shadow-lg shadow-neon-blue/20">
                <i class="fa-brands fa-apple text-lg"></i>
                MOD IOS
            </button>
            <button id="tabAdrBtn" onclick="switchPlatform('adr')" class="py-3 rounded-xl font-orbitron font-bold text-sm tracking-wider flex items-center justify-center gap-2 transition-all text-gray-400 hover:text-white">
                <i class="fa-brands fa-android text-lg"></i>
                MOD ADR
            </button>
        </div>

        <!-- Dynamic Content List Container -->
        <div id="contentContainer" class="space-y-6">
            <!-- Content rendered dynamically via JavaScript -->
        </div>

    </main>

    <!-- JAVASCRIPT -->
    <script>
        // STRICT SEPARATED DATA FOR IOS AND ANDROID
        const FILE_DATA = {
            ios: [
                {
                    categoryName: 'File',
                    links: [
                        {
                            title: 'Edras VTK',
                            url: 'https://link4m.net/xZ5QEUUJ',
                            badge: 'VIP',
                            views: 1250
                        }
                    ]
                }
            ],
            adr: [
                {
                    categoryName: 'File',
                    links: [
                        {
                            title: 'Edras VTK ADR',
                            url: 'https://link4m.net/oaxgpDI',
                            badge: 'VIP',
                            views: 890
                        }
                    ]
                }
            ]
        };

        let currentPlatform = 'ios';

        // Live Realtime Clock
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const dateStr = now.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
            document.getElementById('liveClock').innerText = `${timeStr} - ${dateStr}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Switch Operating System Tabs
        function switchPlatform(plat) {
            currentPlatform = plat;
            const isIos = plat === 'ios';
            
            document.getElementById('tabIosBtn').className = isIos 
                ? 'py-3 rounded-xl font-orbitron font-bold text-sm tracking-wider flex items-center justify-center gap-2 transition-all bg-gradient-to-r from-neon-blue to-blue-600 text-white shadow-lg shadow-neon-blue/20'
                : 'py-3 rounded-xl font-orbitron font-bold text-sm tracking-wider flex items-center justify-center gap-2 transition-all text-gray-400 hover:text-white';

            document.getElementById('tabAdrBtn').className = !isIos 
                ? 'py-3 rounded-xl font-orbitron font-bold text-sm tracking-wider flex items-center justify-center gap-2 transition-all bg-gradient-to-r from-green-500 to-emerald-600 text-white shadow-lg shadow-green-500/20'
                : 'py-3 rounded-xl font-orbitron font-bold text-sm tracking-wider flex items-center justify-center gap-2 transition-all text-gray-400 hover:text-white';

            renderContent();
        }

        // Render List Files for Current Selected Platform
        function renderContent() {
            const container = document.getElementById('contentContainer');
            const categories = FILE_DATA[currentPlatform] || [];

            container.innerHTML = '';

            if (categories.length === 0) {
                container.innerHTML = `
                    <div class="glass-card rounded-2xl p-8 text-center border border-dark-border">
                        <i class="fa-solid fa-folder-open text-3xl text-gray-600 mb-3 block"></i>
                        <p class="text-sm text-gray-400 font-medium">Chưa có file mod nào cho nền tảng này</p>
                    </div>
                `;
                return;
            }

            categories.forEach(cat => {
                const catBox = document.createElement('div');
                catBox.className = 'glass-card rounded-2xl p-4 border border-dark-border';

                let linksHtml = '';
                cat.links.forEach(link => {
                    let badgeColor = 'bg-yellow-500/20 text-yellow-400 border-yellow-500/30';
                    if (link.badge === 'HOT') badgeColor = 'bg-red-500/20 text-red-400 border-red-500/30';
                    if (link.badge === 'NEW') badgeColor = 'bg-green-500/20 text-green-400 border-green-500/30';

                    linksHtml += `
                        <div class="flex items-center justify-between gap-3 p-3 bg-dark-input/70 rounded-xl border border-dark-border/60 hover:border-neon-blue/50 transition-all">
                            <!-- Left File Details Container: Flex-1 and whitespace-normal for full title visibility -->
                            <div class="flex-1 min-w-0 pr-1">
                                <div class="flex flex-wrap items-center gap-2 mb-1">
                                    <span class="inline-block px-1.5 py-0.5 rounded text-[10px] font-bold border ${badgeColor} shrink-0">${link.badge}</span>
                                    <!-- Full text title without truncation -->
                                    <h5 class="text-sm sm:text-base font-bold text-white leading-snug break-words font-sans">${escapeHtml(link.title)}</h5>
                                </div>
                                <span class="text-[11px] text-gray-400 flex items-center gap-1 mt-0.5">
                                    <i class="fa-regular fa-eye text-neon-blue"></i> ${link.views} lượt xem
                                </span>
                            </div>
                            <!-- Right Download Button -->
                            <a href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer" class="btn-neon-blue px-3.5 sm:px-4 py-2 rounded-lg font-orbitron font-bold text-xs text-white flex items-center gap-1.5 shrink-0 shadow-md">
                                <span>VƯỢT LINK</span>
                                <i class="fa-solid fa-angles-right text-[10px]"></i>
                            </a>
                        </div>
                    `;
                });

                catBox.innerHTML = `
                    <div class="flex items-center justify-between mb-3 pb-2 border-b border-dark-border/50">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-folder text-neon-blue"></i>
                            <h4 class="font-orbitron font-bold text-sm text-gray-200 uppercase tracking-wider">${escapeHtml(cat.categoryName)}</h4>
                        </div>
                        <span class="text-xs bg-dark-input px-2.5 py-0.5 rounded-full text-gray-400 border border-dark-border font-mono">${cat.links.length}</span>
                    </div>
                    <div class="space-y-2.5">
                        ${linksHtml}
                    </div>
                `;

                container.appendChild(catBox);
            });
        }

        // HTML Escape Helper
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Initial Render Call
        renderContent();
    </script>
</body>
</html>
