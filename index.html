<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Byte Merger</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}
body{margin:0;padding:20px 14px 40px}
main{max-width:720px;margin:auto}
.card{background:white;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px #00000010}
h1{font-size:26px;margin:0 0 6px}.muted{color:#6b7280;font-size:14px}
button,input{font:inherit}button{border:0;border-radius:12px;padding:12px 15px;font-weight:600}
.primary{background:#111827;color:white;width:100%}.secondary{background:#e5e7eb}
input[type=text]{box-sizing:border-box;width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin:8px 0 12px}
#fileInput{display:none}
.pick{display:block;text-align:center;background:#e5e7eb;cursor:pointer}
ul{list-style:none;padding:0;margin:10px 0}.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eee}
.row:last-child{border-bottom:0}.name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.move{padding:7px 9px;background:#f3f4f6}.remove{padding:7px 9px;background:#fee2e2;color:#b91c1c}
.status{white-space:pre-wrap;text-align:center;color:#4b5563;font-size:14px}
</style>
</head>
<body>
<main>
<div class="card">
<h1>Byte Merger</h1>
<div class="muted">Gộp nhiều file nhị phân/.bytes thành một file bundle ngay trên thiết bị.</div>
</div>

<div class="card">
<label class="pick button" for="fileInput">＋ Chọn file</label>
<input id="fileInput" type="file" multiple>
<ul id="list"></ul>
<div class="muted">Thứ tự từ trên xuống dưới sẽ được giữ khi đóng gói.</div>
</div>

<div class="card">
<label>Tên file xuất</label>
<input id="outputName" type="text" value="MergedBytes.bundle" autocomplete="off">
<button id="mergeBtn" class="primary">Gộp thành một file</button>
</div>

<div class="card">
<div id="status" class="status">Chưa chọn file.</div>
</div>
</main>

<script>
"use strict";

const input = document.getElementById("fileInput");
const list = document.getElementById("list");
const mergeBtn = document.getElementById("mergeBtn");
const outputName = document.getElementById("outputName");
const statusEl = document.getElementById("status");

let files = [];

input.addEventListener("change", () => {
  for (const f of input.files) {
    if (!files.some(x => x.name === f.name && x.size === f.size && x.lastModified === f.lastModified)) {
      files.push(f);
    }
  }
  input.value = "";
  render();
});

function render(){
  list.innerHTML = "";
  files.forEach((file, i) => {
    const li = document.createElement("li");
    li.className = "row";

    const num = document.createElement("span");
    num.textContent = (i + 1) + ".";

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = file.name;

    const up = document.createElement("button");
    up.className = "move";
    up.textContent = "↑";
    up.disabled = i === 0;
    up.onclick = () => { [files[i-1],files[i]]=[files[i],files[i-1]]; render(); };

    const down = document.createElement("button");
    down.className = "move";
    down.textContent = "↓";
    down.disabled = i === files.length-1;
    down.onclick = () => { [files[i],files[i+1]]=[files[i+1],files[i]]; render(); };

    const remove = document.createElement("button");
    remove.className = "remove";
    remove.textContent = "X";
    remove.onclick = () => { files.splice(i,1); render(); };

    li.append(num,name,up,down,remove);
    list.appendChild(li);
  });
  statusEl.textContent = files.length ? `Đã chọn ${files.length} file.` : "Chưa chọn file.";
}

function u16(v){ const a=new Uint8Array(2); new DataView(a.buffer).setUint16(0,v,true); return a; }
function u32(v){ const a=new Uint8Array(4); new DataView(a.buffer).setUint32(0,v,true); return a; }
function u64(v){
  const a=new Uint8Array(8);
  new DataView(a.buffer).setBigUint64(0,BigInt(v),true);
  return a;
}
function concat(parts){
  let total=0; for(const p of parts) total+=p.byteLength;
  const out=new Uint8Array(total); let off=0;
  for(const p of parts){ out.set(new Uint8Array(p),off); off+=p.byteLength; }
  return out;
}

async function buildBundle(){
  if(!files.length){ statusEl.textContent="Hãy chọn ít nhất một file."; return; }

  let name = outputName.value.trim() || "MergedBytes.bundle";
  if(name.includes("/") || name.includes("\\") || name === "." || name === ".."){
    statusEl.textContent="Tên file không hợp lệ."; return;
  }

  mergeBtn.disabled=true;
  statusEl.textContent="Đang đọc file...";

  try {
    const entries=[];
    for(let i=0;i<files.length;i++){
      const f=files[i];
      const data=await f.arrayBuffer();
      entries.push({name:f.name,data});
      statusEl.textContent=`Đang đọc ${i+1}/${files.length}: ${f.name}`;
      await new Promise(r=>setTimeout(r,0));
    }

    // BYTEBNDL1 + 0 padding = 16 bytes
    const magic=new Uint8Array([66,89,84,69,66,78,68,76,49,0,0,0,0,0,0,0]);
    const version=u32(1);
    const count=u32(entries.length);

    let indexSize=0;
    const enc=new TextEncoder();
    const names=[];
    for(const e of entries){
      const nb=enc.encode(e.name);
      if(nb.length>65535) throw new Error("Tên file quá dài: "+e.name);
      names.push(nb);
      indexSize += 2 + nb.length + 8 + 8 + 4;
    }

    let offset=16+4+4+indexSize;
    const indexParts=[];
    for(let i=0;i<entries.length;i++){
      const e=entries[i], nb=names[i];
      indexParts.push(u16(nb.length),nb,u64(offset),u64(e.data.byteLength),u32(0));
      offset += e.data.byteLength;
    }

    const output=concat([magic,version,count,...indexParts,...entries.map(e=>e.data)]);
    const blob=new Blob([output],{type:"application/octet-stream"});
    const url=URL.createObjectURL(blob);

    const a=document.createElement("a");
    a.href=url;
    a.download=name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000);

    statusEl.textContent=`Đã gộp ${files.length} file.\nDung lượng: ${formatBytes(output.byteLength)}\nFile: ${name}`;
  } catch(err){
    statusEl.textContent="Lỗi: "+(err?.message || err);
  } finally {
    mergeBtn.disabled=false;
  }
}

function formatBytes(n){
  if(n<1024) return n+" B";
  if(n<1024**2) return (n/1024).toFixed(1)+" KB";
  if(n<1024**3) return (n/1024**2).toFixed(1)+" MB";
  return (n/1024**3).toFixed(2)+" GB";
}

mergeBtn.addEventListener("click",buildBundle);
render();
</script>
</body>
</html>
