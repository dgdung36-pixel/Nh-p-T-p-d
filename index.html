<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTOOL v1.0 - Web Simulator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-xl bg-slate-800 border border-slate-700 rounded-xl shadow-2xl overflow-hidden">
        <!-- Banner Header -->
        <div class="bg-slate-950 p-4 border-b border-slate-700 text-center font-mono">
            <div class="text-emerald-400 font-bold text-lg tracking-wider">🛠️ KTOOL v1.0</div>
            <div class="text-xs text-slate-400 mt-1">giải mã hóa/mã hóa by Trong Dung</div>
        </div>

        <!-- Nội dung chính / Màn hình tương tác -->
        <div class="p-6 space-y-6">
            <!-- Trạng thái module -->
            <div class="bg-slate-900 p-3 rounded-lg border border-slate-700 font-mono text-xs space-y-1">
                <div class="text-emerald-400">✅ AoV_Zstd đã chuẩn bị sẵn sàng.</div>
                <div class="text-emerald-400">✅ aovt đã chuẩn bị sẵn sàng.</div>
                <div class="text-slate-400 mt-1 font-semibold">🚀 Trạng thái: Sẵn sàng hoạt động.</div>
            </div>

            <!-- Form chức năng -->
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1 text-slate-300">📌 Chọn chế độ làm việc:</label>
                    <select id="modeSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        <option value="d">[1] 📂 Giải nén (giải mã)</option>
                        <option value="c">[2] 📂 Nén (mã hóa)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1 text-slate-300">📂 Đường dẫn file hoặc thư mục:</label>
                    <input type="text" id="pathInput" placeholder="Ví dụ: /sdcard/Download/config.bytes" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none font-mono">
                </div>

                <button onclick="runTool()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-lg transition-all shadow-lg flex items-center justify-center space-x-2">
                    <span>⚡ Thực thi ngay</span>
                </button>
            </div>

            <!-- Khu vực Console Log (Mô phỏng terminal) -->
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">🖥️ Bảng điều khiển (Terminal Log):</label>
                <div id="consoleLog" class="w-full h-40 bg-slate-950 border border-slate-700 rounded-lg p-3 font-mono text-xs overflow-y-auto text-emerald-400 space-y-1">
                    <div>[KTOOL] 🔄 Đang khởi động KTOOL v1.0 (by Trong Dung)...</div>
                    <div>[KTOOL] ✅ Tất cả các module đã sẵn sàng!</div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="bg-slate-950 p-3 border-t border-slate-700 text-center text-xs text-slate-500 font-mono">
            Giao diện mô phỏng KTOOL chạy trên trình duyệt
        </div>
    </div>

    <!-- Script xử lý tương tác giả lập -->
    <script>
        function runTool() {
            const mode = document.getElementById('modeSelect').value;
            const path = document.getElementById('pathInput').value.trim();
            const consoleLog = document.getElementById('consoleLog');

            if (!path) {
                alert('Vui lòng nhập đường dẫn file hoặc thư mục!');
                return;
            }

            const actionName = mode === 'd' ? 'Giải nén' : 'Nén';
            
            // In log bắt đầu
            consoleLog.innerHTML += `<div>[KTOOL] Đang xử lý đường dẫn: ${path} (Chế độ: ${actionName})</div>`;
            
            // Giả lập quá trình chạy sau 1 giây
            setTimeout(() => {
                consoleLog.innerHTML += `<div>[KTOOL] Đang xử lý file...</div>`;
                consoleLog.innerHTML += `<div class="text-green-400">[KTOOL] ✅ Đã xử lý thành công: ${path}</div>`;
                consoleLog.scrollTop = consoleLog.scrollHeight;
            }, 800);
        }
    </script>
</body>
</html>
