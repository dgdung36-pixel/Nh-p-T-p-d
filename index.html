
<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Block World Mobile</title>
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  touch-action: none;
  font-family: Arial, sans-serif;
  background: #87c9f4;
  color: white;
}
#game {
  position: fixed;
  inset: 0;
}
canvas {
  display: block;
}
button {
  border: 1px solid #ffffff55;
  border-radius: 12px;
  background: #17232dcc;
  color: white;
  padding: 10px;
  font-size: 13px;
  font-weight: bold;
  touch-action: manipulation;
}
#top {
  position: fixed;
  top: 8px;
  left: 8px;
  right: 8px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  pointer-events: none;
}
#status, #topbuttons {
  pointer-events: auto;
}
#status {
  background: #17232dcc;
  padding: 10px;
  border-radius: 12px;
  font-size: 12px;
}
#topbuttons {
  display: flex;
  gap: 5px;
}
#leftControls {
  position: fixed;
  bottom: 20px;
  left: 18px;
  width: 120px;
  height: 120px;
}
#joyBase {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: #10182066;
  border: 2px solid #ffffff66;
}
#joyKnob {
  position: absolute;
  left: 35px;
  top: 35px;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: #ffffffdd;
}
#actions {
  position: fixed;
  right: 12px;
  bottom: 18px;
  display: grid;
  grid-template-columns: repeat(2, 58px);
  gap: 6px;
}
.action {
  height: 54px;
  padding: 4px;
  font-size: 11px;
}
#bottomBar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 155px;
  display: flex;
  gap: 4px;
  padding: 5px;
  background: #17232daa;
  border-radius: 12px;
}
.slot {
  width: 42px;
  height: 44px;
  padding: 3px;
  font-size: 10px;
}
.slot.selected {
  border: 2px solid #ffe66d;
}
#inventory {
  display: none;
  position: fixed;
  inset: 0;
  align-items: center;
  justify-content: center;
  background: #0009;
}
#inventory.show {
  display: flex;
}
#invCard {
  width: 90%;
  max-width: 420px;
  max-height: 80vh;
  overflow: auto;
  padding: 16px;
  border-radius: 16px;
  background: #17232df5;
}
#invGrid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.invItem {
  padding: 12px 4px;
  text-align: center;
}
#message {
  position: fixed;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 10px 14px;
  background: #111d;
  border-radius: 12px;
  opacity: 0;
  pointer-events: none;
}
@media (max-width: 600px) {
  #bottomBar {
    max-width: calc(100vw - 16px);
    overflow-x: auto;
  }
}
</style>
</head>
<body>
<div id="game"></div>

<div id="top">
  <div id="status">
    <div id="health">♥ ♥ ♥ ♥ ♥</div>
    <div id="coords">X 0 · Y 0 · Z 0</div>
    <div>Sinh tồn</div>
  </div>
  <div id="topbuttons">
    <button id="invBtn">🎒 Túi đồ</button>
    <button id="saveBtn">💾 Lưu</button>
    <button id="menuBtn">Ⅱ</button>
  </div>
</div>

<div id="leftControls">
  <div id="joyBase"></div>
  <div id="joyKnob"></div>
</div>

<div id="bottomBar"></div>

<div id="actions">
  <button class="action" id="jumpBtn">⬆<br>Nhảy</button>
  <button class="action" id="mineBtn">⛏<br>Phá khối</button>
  <button class="action" id="placeBtn">▧<br>Đặt khối</button>
  <button class="action" id="eatBtn">🍎<br>Ăn</button>
</div>

<div id="inventory">
  <div id="invCard">
    <h2>🎒 Túi đồ</h2>
    <div id="invGrid"></div>
    <p><button id="craftBtn">🪵 Chế tạo ván gỗ</button></p>
    <button id="closeInv">Đóng</button>
  </div>
</div>

<div id="message"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
