<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Offline Media Catalog</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0b0d12;
  --panel:#121620;
  --panel2:#181d28;
  --border:#272e3b;
  --text:#f4f6fa;
  --muted:#929aaa;
  --accent:#6c63ff;
  --accent2:#8b85ff;
  --danger:#ff5c70;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(11,13,18,.94);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}

.nav{
  max-width:1200px;
  margin:auto;
  min-height:68px;
  padding:12px 18px;
  display:flex;
  align-items:center;
  gap:20px;
}

.logo{
  font-size:21px;
  font-weight:800;
  white-space:nowrap;
}

.logo span{color:var(--accent)}

.search{
  flex:1;
  position:relative;
}

.search input{
  width:100%;
  height:42px;
  border:1px solid var(--border);
  border-radius:12px;
  outline:none;
  background:var(--panel);
  color:var(--text);
  padding:0 16px;
  font-size:14px;
}

.search input:focus{
  border-color:var(--accent);
}

.menu-btn{
  display:none;
  border:0;
  background:var(--panel);
  color:white;
  width:42px;
  height:42px;
  border-radius:10px;
  font-size:20px;
}

/* MAIN */
main{
  max-width:1200px;
  margin:auto;
  padding:28px 18px 50px;
}

.hero{
  padding:28px;
  border:1px solid var(--border);
  background:
    radial-gradient(circle at 90% 20%,rgba(108,99,255,.25),transparent 35%),
    var(--panel);
  border-radius:20px;
  margin-bottom:25px;
}

.hero h1{
  font-size:32px;
  margin-bottom:8px;
}

.hero p{
  color:var(--muted);
  line-height:1.6;
}

/* FILTER */
.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.categories{
  display:flex;
  gap:8px;
  overflow:auto;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{display:none}

.category{
  flex:none;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  padding:9px 14px;
  border-radius:999px;
  cursor:pointer;
  transition:.2s;
}

.category:hover,
.category.active{
  background:var(--accent);
  color:white;
  border-color:var(--accent);
}

.count{
  color:var(--muted);
  white-space:nowrap;
  font-size:14px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
  transition:.22s;
}

.card:hover{
  transform:translateY(-4px);
  border-color:#454d60;
}

.thumb{
  position:relative;
  aspect-ratio:16/10;
  overflow:hidden;
  background:#202532;
}

.thumb img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  transition:.3s;
}

.card:hover .thumb img{
  transform:scale(1.05);
}

.badge{
  position:absolute;
  top:9px;
  left:9px;
  background:rgba(0,0,0,.72);
  color:white;
  padding:5px 8px;
  border-radius:7px;
  font-size:11px;
}

.duration{
  position:absolute;
  right:9px;
  bottom:9px;
  background:rgba(0,0,0,.75);
  color:white;
  padding:4px 7px;
  border-radius:6px;
  font-size:11px;
}

.info{
  padding:13px;
}

.title{
  font-size:15px;
  font-weight:700;
  line-height:1.4;
  margin-bottom:7px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.meta{
  color:var(--muted);
  font-size:12px;
  display:flex;
  justify-content:space-between;
}

/* PAGINATION */
.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  margin-top:32px;
  flex-wrap:wrap;
}

.page-btn{
  min-width:40px;
  height:40px;
  padding:0 12px;
  border-radius:9px;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  cursor:pointer;
}

.page-btn:hover{
  border-color:var(--accent);
}

.page-btn.active{
  background:var(--accent);
  border-color:var(--accent);
}

.page-btn:disabled{
  opacity:.35;
  cursor:not-allowed;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(8px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal.show{display:flex}

.modal-box{
  width:min(700px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  position:relative;
}

.modal-img{
  width:100%;
  max-height:360px;
  object-fit:cover;
  display:block;
}

.modal-content{
  padding:22px;
}

.modal-content h2{
  margin-bottom:10px;
}

.modal-content p{
  color:var(--muted);
  line-height:1.7;
}

.close{
  position:absolute;
  top:12px;
  right:12px;
  z-index:2;
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.7);
  color:white;
  font-size:20px;
  cursor:pointer;
}

/* EMPTY */
.empty{
  display:none;
  text-align:center;
  padding:70px 20px;
  color:var(--muted);
}

.empty strong{
  display:block;
  color:white;
  font-size:20px;
  margin-bottom:8px;
}

/* RESPONSIVE */
@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:680px){
  .nav{
    flex-wrap:wrap;
  }

  .logo{
    flex:1;
  }

  .menu-btn{
    display:block;
  }

  .search{
    order:3;
    flex-basis:100%;
  }

  main{
    padding:18px 12px 40px;
  }

  .hero{
    padding:22px;
  }

  .hero h1{
    font-size:25px;
  }

  .toolbar{
    display:block;
  }

  .count{
    margin-top:12px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:11px;
  }

  .info{
    padding:10px;
  }

  .title{
    font-size:13px;
  }
}

@media(max-width:390px){
  .grid{
    grid-template-columns:1fr 1fr;
  }

  .pagination{
    gap:4px;
  }

  .page-btn{
    min-width:36px;
    height:36px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">Offline<span>Catalog</span></div>

    <div class="search">
      <input
        id="search"
        type="search"
        placeholder="Tìm kiếm nội dung..."
        autocomplete="off">
    </div>

    <button class="menu-btn" onclick="scrollToTop()">☰</button>
  </div>
</header>

<main>

  <section class="hero">
    <h1>Media Catalog</h1>
    <p>
      Website dữ liệu mẫu chạy hoàn toàn offline.
      Không cần máy chủ, API hoặc Internet.
    </p>
  </section>

  <div class="toolbar">
    <div class="categories" id="categories"></div>
    <div class="count" id="count"></div>
  </div>

  <section class="grid" id="grid"></section>

  <div class="empty" id="empty">
    <strong>Không tìm thấy nội dung</strong>
    Hãy thử từ khóa hoặc thể loại khác.
  </div>

  <div class="pagination" id="pagination"></div>

</main>

<div class="modal" id="modal" onclick="closeOutside(event)">
  <div class="modal-box">
    <button class="close" onclick="closeModal()">×</button>

    <img id="modalImg" class="modal-img" alt="">

    <div class="modal-content">
      <h2 id="modalTitle"></h2>
      <p id="modalDescription"></p>
      <br>
      <p id="modalMeta"></p>
    </div>
  </div>
</div>

<script>
/*
  ==========================================

  Có thể sửa / thêm object ở đây.
  ==========================================
*/

const DATA = [
  {

  },
  {

  {

  {

  {

  },
  {
    title:"Old Town",
    category:"Travel",
    duration:"08:14",
    views:"1.1K",
    date:"16/09/2026",
    description:"Một khu phố cổ với kiến trúc đặc trưng.",
    image:"https://picsum.photos/seed/oldtown/800/500"
  },
  {

    image:"https://picsum.photos/seed/minimal/800/500"
  },
  {
    title:"Night Photography",
    category:"Photography",
    duration:"12:18",
    views:"3.1K",
    date:"14/09/2026",
    description:"Nhiếp ảnh đường phố về đêm.",
    image:"https://picsum.photos/seed/nightphoto/800/500"
  }
];

/*
  ==========================================
  CONFIG
  ==========================================
*/

const PER_PAGE = 8;

let currentPage = 1;
let currentCategory = "All";
let currentSearch = "";

/*
  ==========================================
  CATEGORY
  ==========================================
*/

function buildCategories(){

  const categories = [
    "All",
    ...new Set(DATA.map(item => item.category))
  ];

  const box = document.getElementById("categories");

  box.innerHTML = categories.map(category => `
    <button
      class="category ${category === "All" ? "active" : ""}"
      onclick="setCategory('${escapeHTML(category)}', this)">
      ${escapeHTML(category)}
    </button>
  `).join("");
}

function setCategory(category, button){

  currentCategory = category;
  currentPage = 1;

  document
    .querySelectorAll(".category")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  render();
}

/*
  ==========================================
  FILTER
  ==========================================
*/

document.getElementById("search").addEventListener("input", e => {

  currentSearch = e.target.value.trim().toLowerCase();
  currentPage = 1;

  render();
});

function getFiltered(){

  return DATA.filter(item => {

    const categoryMatch =
      currentCategory === "All" ||
      item.category === currentCategory;

    const searchMatch =
      !currentSearch ||
      item.title.toLowerCase().includes(currentSearch) ||
      item.category.toLowerCase().includes(currentSearch) ||
      item.description.toLowerCase().includes(currentSearch);

    return categoryMatch && searchMatch;
  });
}

/*
  ==========================================
  RENDER
  ==========================================
*/

function render(){

  const data = getFiltered();

  const totalPages = Math.max(
    1,
    Math.ceil(data.length / PER_PAGE)
  );

  if(currentPage > totalPages){
    currentPage = totalPages;
  }

  const start = (currentPage - 1) * PER_PAGE;

  const pageData = data.slice(
    start,
    start + PER_PAGE
  );

  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");

  grid.innerHTML = "";

  if(!pageData.length){

    empty.style.display = "block";

  }else{

    empty.style.display = "none";

    pageData.forEach((item,index) => {

      const card = document.createElement("article");

      card.className = "card";

      card.onclick = () => openModal(
        start + index
      );

      card.innerHTML = `
        <div class="thumb">

          <img
            src="${item.image}"
            alt="${escapeHTML(item.title)}"
            loading="lazy">

          <span class="badge">
            ${escapeHTML(item.category)}
          </span>

          <span class="duration">
            ${escapeHTML(item.duration)}
          </span>

        </div>

        <div class="info">

          <div class="title">
            ${escapeHTML(item.title)}
          </div>

          <div class="meta">
            <span>${escapeHTML(item.views)} views</span>
            <span>${escapeHTML(item.date)}</span>
          </div>

        </div>
      `;

      grid.appendChild(card);
    });
  }

  document.getElementById("count").textContent =
    `${data.length} kết quả`;

  renderPagination(totalPages);
}

/*
  ==========================================
  PAGINATION
  ==========================================
*/

function renderPagination(totalPages){

  const pagination =
    document.getElementById("pagination");

  if(totalPages <= 1){

    pagination.innerHTML = "";
    return;
  }

  let html = "";

  html += `
    <button
      class="page-btn"
      onclick="goPage(${currentPage - 1})"
      ${currentPage === 1 ? "disabled" : ""}>
      ‹
    </button>
  `;

  const pages = [];

  if(totalPages <= 7){

    for(let i=1;i<=totalPages;i++){
      pages.push(i);
    }

  }else{

    pages.push(1);

    if(currentPage > 3){
      pages.push("...");
    }

    const start = Math.max(2,currentPage-1);
    const end = Math.min(totalPages-1,currentPage+1);

    for(let i=start;i<=end;i++){
      pages.push(i);
    }

    if(currentPage < totalPages-2){
      pages.push("...");
    }

    pages.push(totalPages);
  }

  pages.forEach(page => {

    if(page === "..."){

      html += `
        <span class="page-btn"
          style="cursor:default">
          …
        </span>
      `;

    }else{

      html += `
        <button
          class="page-btn ${page === currentPage ? "active" : ""}"
          onclick="goPage(${page})">
          ${page}
        </button>
      `;
    }
  });

  html += `
    <button
      class="page-btn"
      onclick="goPage(${currentPage + 1})"
      ${currentPage === totalPages ? "disabled" : ""}>
      ›
    </button>
  `;

  pagination.innerHTML = html;
}

function goPage(page){

  const totalPages = Math.max(
    1,
    Math.ceil(getFiltered().length / PER_PAGE)
  );

  if(page < 1 || page > totalPages){
    return;
  }

  currentPage = page;

  render();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

/*
  ==========================================
  MODAL
  ==========================================
*/

function openModal(index){

  const data = getFiltered();
  const item = data[index];

  if(!item) return;

  document.getElementById("modalImg").src =
    item.image;

  document.getElementById("modalTitle").textContent =
    item.title;

  document.getElementById("modalDescription").textContent =
    item.description;

  document.getElementById("modalMeta").textContent =
    `${item.category} • ${item.duration} • ${item.views} views • ${item.date}`;

  document.getElementById("modal")
    .classList.add("show");

  document.body.style.overflow = "hidden";
}

function closeModal(){

  document.getElementById("modal")
    .classList.remove("show");

  document.body.style.overflow = "";
}

function closeOutside(event){

  if(event.target.id === "modal"){
    closeModal();
  }
}

document.addEventListener("keydown", event => {

  if(event.key === "Escape"){
    closeModal();
  }
});

/*
  ==========================================
  UTILITIES
  ==========================================
*/

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function scrollToTop(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

/*
  ==========================================
  START
  ==========================================
*/

buildCategories();
render();

</script>
