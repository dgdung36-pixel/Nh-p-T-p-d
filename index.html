<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FILE MOD LQ - TRONG DUNG</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#080a0f',
                            card: '#111522',
                            border: '#1e2638',
                            cyan: '#00f2fe',
                            blue: '#4facfe',
                            pink: '#f857a6',
                            purple: '#ff5858'
                        }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        jakarta: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #07090e;
            color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-image: 
                radial-gradient(ellipse at 50% -10%, rgba(0, 242, 254, 0.15), transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(248, 87, 166, 0.08), transparent 50%);
            background-attachment: fixed;
        }

        .neon-title {
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #f857a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
        }

        .glass-box {
            background: rgba(17, 21, 34, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-gradient-ios {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.25);
            transition: all 0.25s ease;
        }
        .btn-gradient-ios:hover {
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.45);
            transform: translateY(-2px);
        }

        .btn-gradient-adr {
            background: linear-gradient(135deg, #f857a6 0%, #ff5858 100%);
            box-shadow: 0 4px 15px rgba(248, 87, 166, 0.25);
            transition: all 0.25s ease;
        }
        .btn-gradient-adr:hover {
            box-shadow: 0 6px 20px rgba(248, 87, 166, 0.45);
            transform: translateY(-2px);
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #07090e; }
        ::-webkit-scrollbar-thumb { background: #1e2638; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00f2fe; }
    </style>
</head>
<body class="min-h-screen pb-12 flex flex-col justify-between items-center">

    <div class="w-full">
        <!-- HEADER SECTION -->
        <header class="pt-8 pb-4 px-4 text-center max-w-lg mx-auto">
            <!-- Clock -->
            <div class="inline-flex items-center gap-2 bg-brand-card/90 border border-brand-border px-3.5 py-1.5 rounded-full mb-4 shadow-lg">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                <span id="liveClock" class="font-orbitron text-[11px] font-bold tracking-wider text-cyan-300">00:00:00 - 01/01/2026</span>
            </div>

            <!-- Name Title -->
            <h1 class="neon-title text-3xl sm:text-4xl font-black tracking-wider uppercase mb-1">TRONG DUNG</h1>
            
            <p class="text-xs font-bold text-gray-400 tracking-widest uppercase mb-5">FILE MOD LIÊN QUÂN VIP</p>

            <!-- Social Links Panel (Fixed overflow issues) -->
            <div class="flex flex-wrap items-center justify-center gap-2.5 max-w-md mx-auto">
                <!-- Youtube -->
                <a href="https://youtube.com/@trdunxx?si=tGWPnDMwmzyX1BaU" target="_blank" class="flex-1 min-w-[110px] glass-box px-3 py-2 rounded-xl border border-red-500/20 hover:border-red-500/50 text-red-400 hover:text-white hover:bg-red-500/10 flex items-center justify-center gap-2 transition-all">
                    <i class="fa-brands fa-youtube text-base"></i>
                    <span class="font-orbitron text-[11px] font-bold">YOUTUBE</span>
                </a>
                <!-- Telegram -->
                <a href="https://t.me/TrongDung05" target="_blank" class="flex-1 min-w-[110px] glass-box px-3 py-2 rounded-xl border border-sky-400/20 hover:border-sky-400/50 text-sky-400 hover:text-white hover:bg-sky-500/10 flex items-center justify-center gap-2 transition-all">
                    <i class="fa-brands fa-telegram text-base"></i>
                    <span class="font-orbitron text-[11px] font-bold">TELEGRAM</span>
                </a>
                <!-- Zalo -->
                <a href="https://zalo.me/0836376886" target="_blank" class="flex-1 min-w-[100px] glass-box px-3 py-2 rounded-xl border border-blue-500/20 hover:border-blue-500/50 text-blue-400 hover:text-white hover:bg-blue-600/10 flex items-center justify-center gap-2 transition-all">
                    <i class="fa-solid fa-comment-dots text-base"></i>
                    <span class="font-orbitron text-[11px] font-bold">ZALO</span>
                </a>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main class="max-w-lg mx-auto px-4 mt-2">

            <!-- OS Switcher Tabs -->
            <div class="grid grid-cols-2 gap-2.5 mb-5 p-1.5 glass-box rounded-2xl">
                <button id="tabIosBtn" onclick="switchPlatform('ios')" class="py-3 rounded-xl font-orbitron font-bold text-xs sm:text-sm tracking-wider flex items-center justify-center gap-2 transition-all bg-gradient-to-r from-cyan-400 to-blue-500 text-white shadow-lg shadow-cyan-500/20">
                    <i class="fa-brands fa-apple text-base"></i>
                    MOD IOS
                </button>
                <button id="tabAdrBtn" onclick="switchPlatform('adr')" class="py-3 rounded-xl font-orbitron font-bold text-xs sm:text-sm tracking-wider flex items-center justify-center gap-2 transition-all text-gray-400 hover:text-white">
                    <i class="fa-brands fa-android text-base"></i>
                    MOD ADR
                </button>
            </div>

            <!-- Dynamic File Container -->
            <div id="contentContainer" class="space-y-4">
                <!-- Content generated via JS -->
            </div>

            <!-- Info Box -->
            <div class="mt-6 glass-box p-3.5 rounded-xl border border-brand-border text-center">
                <p class="text-xs text-gray-400 font-medium">
                    <i class="fa-solid fa-shield-halved text-cyan-400 mr-1"></i>
                    Tất cả File Mod đã được kiểm duyệt an toàn 100%. Liên hệ Zalo/Tele nếu cần giúp đỡ.
                </p>
            </div>

        </main>
    </div>

    <!-- FOOTER -->
    <footer class="mt-10 text-center text-[11px] text-gray-500 font-medium">
        <p>© 2026 FILE MOD LQ • Developed by <span class="text-cyan-400 font-bold">TRONG DUNG</span></p>
    </footer>

    <!-- JAVASCRIPT -->
    <script>
        // DATA CONFIGURATION
        const FILE_DATA = {
            ios: [
                {
                    categoryName: 'File',
                    links: [
                        {
                            title: 'Edras VTK',
                            url: 'https://link4m.net/xZ5QEUUJ',
                            badge: 'VIP',
                            views: '1.2K'
                        }
                    ]
                }
            ],
            adr: [
                {
                    categoryName: 'File',
                    links: [
                        {
                            title: 'Edras VTK ADR',
                            url: 'https://link4m.net/oaxgpDI',
                            badge: 'VIP',
                            views: '890'
                        }
                    ]
                }
            ]
        };

        let currentPlatform = 'ios';

        // Live Clock Function
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const dateStr = now.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
            document.getElementById('liveClock').innerText = `${timeStr} - ${dateStr}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Platform Switcher Function
        function switchPlatform(plat) {
            currentPlatform = plat;
            const isIos = plat === 'ios';
            
            document.getElementById('tabIosBtn').className = isIos 
                ? 'py-3 rounded-xl font-orbitron font-bold text-xs sm:text-sm tracking-wider flex items-center justify-center gap-2 transition-all bg-gradient-to-r from-cyan-400 to-blue-500 text-white shadow-lg shadow-cyan-500/20'
                : 'py-3 rounded-xl font-orbitron font-bold text-xs sm:text-sm tracking-wider flex items-center justify-center gap-2 transition-all text-gray-400 hover:text-white';

            document.getElementById('tabAdrBtn').className = !isIos 
                ? 'py-3 rounded-xl font-orbitron font-bold text-xs sm:text-sm tracking-wider flex items-center justify-center gap-2 transition-all bg-gradient-to-r from-pink-500 to-red-500 text-white shadow-lg shadow-pink-500/20'
                : 'py-3 rounded-xl font-orbitron font-bold text-xs sm:text-sm tracking-wider flex items-center justify-center gap-2 transition-all text-gray-400 hover:text-white';

            renderContent();
        }

        // Render File Cards Function
        function renderContent() {
            const container = document.getElementById('contentContainer');
            const categories = FILE_DATA[currentPlatform] || [];

            container.innerHTML = '';

            if (categories.length === 0) {
                container.innerHTML = `
                    <div class="glass-box rounded-2xl p-8 text-center border border-brand-border">
                        <i class="fa-solid fa-folder-open text-3xl text-gray-600 mb-2 block"></i>
                        <p class="text-xs text-gray-400 font-medium">Chưa có file mod nào cho nền tảng này</p>
                    </div>
                `;
                return;
            }

            categories.forEach(cat => {
                const catBox = document.createElement('div');
                catBox.className = 'glass-box rounded-2xl p-4 border border-brand-border';

                let linksHtml = '';
                cat.links.forEach(link => {
                    let badgeColor = 'bg-amber-500/10 text-amber-300 border-amber-500/30';
                    if (link.badge === 'HOT') badgeColor = 'bg-red-500/10 text-red-400 border-red-500/30';
                    if (link.badge === 'NEW') badgeColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';

                    linksHtml += `
                        <div class="flex items-center justify-between gap-3 p-3 bg-brand-card/90 rounded-xl border border-brand-border hover:border-cyan-400/40 transition-all">
                            <div class="flex-1 min-w-0 pr-1">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="inline-block px-1.5 py-0.5 rounded text-[10px] font-bold border ${badgeColor}">${link.badge}</span>
                                    <h5 class="text-sm font-bold text-white leading-snug break-words">${link.title}</h5>
                                </div>
                                <div class="text-[11px] text-gray-400 flex items-center gap-2">
                                    <span><i class="fa-regular fa-eye text-cyan-400 mr-1"></i>${link.views}</span>
                                </div>
                            </div>
                            <a href="${link.url}" target="_blank" class="${currentPlatform === 'ios' ? 'btn-gradient-ios' : 'btn-gradient-adr'} px-3.5 py-2 rounded-lg font-orbitron font-bold text-[11px] text-white flex items-center gap-1.5 shrink-0">
                                <span>VƯỢT LINK</span>
                                <i class="fa-solid fa-arrow-right-long text-[10px]"></i>
                            </a>
                        </div>
                    `;
                });

                catBox.innerHTML = `
                    <div class="flex items-center justify-between mb-3 pb-2 border-b border-brand-border">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-folder-closed text-cyan-400 text-sm"></i>
                            <h4 class="font-orbitron font-bold text-xs text-gray-200 uppercase tracking-wider">${cat.categoryName}</h4>
                        </div>
                        <span class="text-[11px] bg-brand-card px-2 py-0.5 rounded-full text-cyan-300 border border-brand-border font-bold">${cat.links.length} FILE</span>
                    </div>
                    <div class="space-y-2">
                        ${linksHtml}
                    </div>
                `;

                container.appendChild(catBox);
            });
        }

        // Initial Render
        renderContent();
    </script>
</body>
</html>
